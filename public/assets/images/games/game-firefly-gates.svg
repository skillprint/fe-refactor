    <rect x="186" y="64" width="8" height="70" rx="3" fill="#2b3a55"/>
    <rect x="258" y="64" width="10" height="70" rx="3" fill="#2b3a55"/>
    <rect x="122" y="70" width="64" height="44" rx="6" fill="#f2c14e" opacity="0.22"/>
