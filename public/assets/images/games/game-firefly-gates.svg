<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="210" viewBox="0 0 380 210">
  <title>Firefly Gates</title>
  <desc>Skillprint game card: a swarm of fireflies flying toward two glowing gates, times three and plus twelve, in a misty night forest</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1433"/>
      <stop offset="0.65" stop-color="#123447"/>
      <stop offset="1" stop-color="#0e2a33"/>
    </linearGradient>
    <radialGradient id="glow">
