    <rect x="122" y="70" width="64" height="44" rx="6" fill="none" stroke="#f2c14e" stroke-width="2"/>
    <rect x="194" y="70" width="64" height="44" rx="6" fill="none" stroke="#5fe08a" stroke-width="2"/>
    <g font-family="'Outfit', 'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
