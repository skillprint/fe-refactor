      <stop offset="0.35" stop-color="#e8e46a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#d7e85a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="380" height="210" fill="url(#sky)"/>
  <g fill="#0f2633">
    <path d="M0 150 L18 96 L36 150Z M30 150 L52 80 L74 150Z M300 150 L322 84 L344 150Z M336 150 L358 98 L380 150Z"/>
  </g>
  <g fill="#0a1c27">
