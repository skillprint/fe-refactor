<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="Simon Says - A fun memory game. Test your memory by repeating the sequence of colors!"
    />
    <title>Simon Says Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="Style.css" />
  </head>
  <body>
    <h1 class="fade-in">🎮 Simon Says</h1>

    <div class="game-info">
      <div class="score-display">
        <span class="icon">📊</span><span id="current-level">0</span>
      </div>
      <div class="high-score-display">
        <span class="icon">🏆</span><span id="high-score">0</span>
      </div>
    </div>

    <div class="difficulty-selector">
      <label for="difficulty-slider">Difficulty: <span id="difficulty-value">1.00x</span></label>
      <input type="range" id="difficulty-slider" min="0.5" max="1.5" step="0.05" value="1" />
    </div>

    <h2 id="game-status"></h2>

    <div class="play-field">
      <div class="status-badge" id="status-badge">
        <svg class="checkmark" id="checkmark" viewBox="0 0 52 52">
          <circle class="checkmark-circle" cx="26" cy="26" r="24" />
          <path class="checkmark-check" d="M14 27l7 7 16-16" />
        </svg>
        <svg class="countdown-ring" viewBox="0 0 60 60">
          <circle class="countdown-ring-bg" cx="30" cy="30" r="26" />
          <circle class="countdown-ring-progress" id="countdown-ring-progress" cx="30" cy="30" r="26" />
        </svg>
      </div>

      <div class="btn-container" id="btn-container"></div>

      <button class="play-button" id="play-btn" aria-label="Play">▶</button>
    </div>

    <script src="app.js"></script>
    <script src="skillprintShim.js"></script>
    <script src="../../_shared/skillprintScreenshot.js"></script>
</body>
</html>
