<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Drones · Skillprint harness</title>
<!--
  The Skillprint portal's side of the game, for testing without the portal
  (src/skillprint/bridge.ts): the game in an iframe, every message it posts
  logged, its keys 1-9 turned into ADJUST_GAME presets the way the portal's
  adjustment tester does (the same presets as fe-refactor's
  GameAdjustmentTester.tsx), and Pause / Resume. The portal build ships it as
  static/iframeTest.html; tools/skillprint-smoke.mjs drives it.
-->
<style>
  :root { color-scheme: dark; --bg: #10131c; --panel: #181d2a; --ink: #e8e4da; --dim: #8b93a7; --accent: #f2c46d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 ui-monospace, Menlo, monospace; display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  aside { background: var(--panel); padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 14px; margin: 0; color: var(--accent); }
  button { font: inherit; background: #262d40; color: var(--ink); border: 1px solid #39425a; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  #state { white-space: pre; color: var(--dim); }
  #log { flex: 1; overflow: auto; border-top: 1px solid #2b3246; padding-top: 6px; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev { color: var(--accent); }
  img { width: 100%; border-radius: 4px; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh 40vh; } }
</style>
</head>
<body>
<iframe id="game" src="index.html" allow="fullscreen; autoplay"></iframe>
<aside>
  <h1>Skillprint harness</h1>
  <div class="row" id="presets"></div>
  <div class="row"><button id="pause">Pause</button><button id="resume">Resume</button></div>
  <div id="state">no gameState yet</div>
  <img id="frame" alt="" hidden>
  <div id="log"></div>
</aside>
<script>
  // keys 1-9: the portal's adjustment tester presets for battle-drones
  const PRESETS = {
    "1": { label: "Relax", adjust: { aiIncomeMult: 0.6, aiReactionSec: 4.5, aiAssaultMult: 1.8, playerIncomeMult: 1.4 } },
    "2": { label: "Gentle", adjust: { aiIncomeMult: 0.8, aiReactionSec: 3.5, aiAssaultMult: 1.35, playerIncomeMult: 1.15 } },
    "3": { label: "Default", adjust: { aiIncomeMult: 1, aiReactionSec: 2, aiAssaultMult: 1, playerIncomeMult: 1 } },
    "4": { label: "Brisk", adjust: { aiIncomeMult: 1.15, aiReactionSec: 1.5, aiAssaultMult: 0.9 } },
    "5": { label: "Grit", adjust: { aiIncomeMult: 1.35, aiReactionSec: 1.1, aiAssaultMult: 0.75, playerIncomeMult: 0.85 } },
    "6": { label: "Next: Easy", adjust: { aiDifficulty: 0 } },
    "7": { label: "Next: Hard", adjust: { aiDifficulty: 2 } },
    "8": { label: "Lean economy", adjust: { playerIncomeMult: 0.6 } },
    "9": { label: "Extreme", adjust: { aiIncomeMult: 1.6, aiReactionSec: 0.8, aiAssaultMult: 0.6, playerIncomeMult: 0.5 } }
  };
  const game = document.getElementById("game");
  const log = document.getElementById("log");
  const harness = (window.harness = { messages: [], screenshots: 0, completed: null, state: null });

  function line(text, cls) {
    const d = document.createElement("div");
    d.textContent = text;
    if (cls) d.className = cls;
    log.prepend(d);
    while (log.childElementCount > 300) log.lastChild.remove();
  }

  function adjust(key) {
    const p = PRESETS[key];
    if (!p) return;
    for (const [parameterName, parameterValue] of Object.entries(p.adjust))
      game.contentWindow.postMessage({ type: "ADJUST_GAME", data: { parameterName, parameterValue } }, "*");
    line(`⇢ ${key} ${p.label}: ${JSON.stringify(p.adjust)}`);
  }
  harness.adjust = adjust;

  for (const [key, p] of Object.entries(PRESETS)) {
    const b = document.createElement("button");
    b.textContent = `${key} ${p.label}`;
    b.onclick = () => adjust(key);
    document.getElementById("presets").append(b);
  }
  document.getElementById("pause").onclick = () => game.contentWindow.postMessage({ type: "GAME_PAUSE" }, "*");
  document.getElementById("resume").onclick = () => game.contentWindow.postMessage({ type: "GAME_RESUME" }, "*");

  window.addEventListener("message", (e) => {
    if (e.source !== game.contentWindow) return;
    const m = e.data || {};
    if (m.type === "screenshot") {
      harness.screenshots++;
      const img = document.getElementById("frame");
      img.src = m.dataUrl;
      img.hidden = false;
      return;
    }
    harness.messages.push(m);
    if (m.type === "skillprint_keydown") adjust(m.key);
    else if (m.type === "gameState") {
      harness.state = m.data;
      document.getElementById("state").textContent = JSON.stringify(m.data, null, 1);
    } else if (m.type === "gameEvent") {
      const { event, at, ...rest } = m.data;
      line(`${event} ${JSON.stringify(rest)}`, "ev");
    } else if (m.type === "GAME_COMPLETE") {
      harness.completed = m.data;
      line(`GAME_COMPLETE ${JSON.stringify(m.data)}`, "ev");
    } else line(JSON.stringify(m));
  });
</script>
</body>
</html>
