<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Cut The Rope Responsive</title>
		<meta charset="utf-8">
		<meta name="viewport" content="initial-scale=1, width=device-width, interactive-widget=resizes-content" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
		<style>
			body {
				margin: 0px;
				overflow: hidden;
				background-color: black;
			}
		</style>
		<script src="./skillprintShim.js"></script>
		<script src="../../SkillprintLib/html2canvas.min.js"></script>
		<script src="./cutTheRopeScreenshot.js"></script>
		<script>
		function logEvent(params) {
			params.messageType = 'gameEvent';
			const paramsAsJSON = JSON.stringify(params);
			if (globalThis.ReactNativeWebView) {
				globalThis.ReactNativeWebView.postMessage(paramsAsJSON);
			} else {
				window.parent.postMessage(paramsAsJSON, "*");
			}
		}
		globalThis.logEvent = logEvent;
		</script>
	</head>
	<body>
		<script src="ctrr.js?v=1.6.20"></script>
		<script>Ctrr.main()</script>
	</body>
</html>
