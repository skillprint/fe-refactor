<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Cut The Rope Responsive</title>
		<meta charset="utf-8">
		<meta name="viewport" content="initial-scale=1, width=device-width, interactive-widget=resizes-content" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
		<style>
			body {
				margin: 0px;
				overflow: hidden;
				background-color: black;
			}
		</style>
		<script src="./skillprintShim.js"></script>
		<script src="./cutTheRopeScreenshot.js"></script>
		<script>
		// ctrr.js calls logEvent({event, ...}) at level start, star, rope cut, win and
		// loss. Posted as {type: 'gameEvent', data: {event, at, ...}}, the message
		// GameClient records; `at` is when it happened, in epoch ms. (This replaces
		// the old transport, a JSON string the portal ignored.)
		function logEvent(params) {
			try {
				if (window.parent === window) return;
				const data = Object.assign({}, params, { at: performance.timeOrigin + performance.now() });
				window.parent.postMessage({ type: 'gameEvent', data }, window.location.origin);
			} catch (e) { /* telemetry must never break the game */ }
		}
		globalThis.logEvent = logEvent;
		</script>
	</head>
	<body>
		<script src="ctrr.js?v=1.6.20"></script>
		<script>Ctrr.main()</script>
	</body>
</html>
