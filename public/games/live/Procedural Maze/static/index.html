<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Procedural Maze</title>
  <link rel="stylesheet" href="../../_shared/game.css">
  <style>.stage{padding:10px}#maze{width:min(480px,92vw);height:auto;border-radius:10px;background:#1b1b2f;touch-action:none}
#pad{margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:4px}#pad .btn{padding:8px 16px;margin:2px}</style>
</head>
<body>
  <h1>Procedural Maze</h1>
  <div class="hud"><span><span class="icon">🚶</span><span id="hud-moves">0</span></span><span><span class="icon">⏱</span><span id="hud-time">0.0s</span></span><span><span class="icon">✅</span><span id="hud-solved">0</span></span><span><span class="icon">🏆</span><span id="hud-best">—</span></span></div>
  <div class="stage">
    <button id="play-btn" class="play-button">▶</button>
    <canvas id="maze" width="480" height="480"></canvas>
    <div id="pad"><button class="btn" data-d="0,-1">▲</button><div><button class="btn" data-d="-1,0">◀</button><button class="btn" data-d="0,1">▼</button><button class="btn" data-d="1,0">▶</button></div></div>
  </div>
  <p id="msg" class="msg">Find the exit. Arrow keys, WASD, swipe, or the pad.</p>
  <script src="game.js"></script>
  <script src="skillprintShim.js"></script>
  <script src="../../_shared/skillprintScreenshot.js"></script>
</body>
</html>
