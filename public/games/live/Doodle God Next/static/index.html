    function logEvent(params) {
      params.messageType = 'gameEvent';
      const paramsAsJSON = JSON.stringify(params);
      if (globalThis.ReactNativeWebView) {
        globalThis.ReactNativeWebView.postMessage(paramsAsJSON);
      } else {
        window.parent.postMessage(paramsAsJSON, "*");
      }
    }
    globalThis.logEvent = logEvent;

        window.host_assets = () => {
            document.querySelectorAll('[data-src]').forEach((el) => {

                } else {
                    el.setAttribute('src', p);
                }
            });

    <script>
        //______________________________________________________________________________________________
        HTMLElement.prototype.setLongPressClick = function (callback, duration = 1500) {
            let timer;
            const element = this;

            const startPress = (e) => {
                if (e.type === 'mousedown' && e.button !== 0) return;

                timer = setTimeout(() => {
                    callback();
                }, duration);
            };

            const cancelPress = () => {
                clearTimeout(timer);
            };

            element.addEventListener('mousedown', startPress);
            element.addEventListener('touchstart', startPress, { passive: true });

            element.addEventListener('mouseup', cancelPress);
            element.addEventListener('mouseleave', cancelPress);
            element.addEventListener('touchend', cancelPress);
            element.addEventListener('touchmove', cancelPress); // Отмена при сдвиге пальца
        };
    </script>
