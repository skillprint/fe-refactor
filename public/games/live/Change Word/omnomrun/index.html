    <script>
        window.famobi_gameID = "{FAMOBI_GAMEID}"; // the actual GAMEID is added to the final version by Famobi

            function() {
                window.MAX_REVIVES_PER_LEVEL = undefined; //controls how many revives could players have per level. undefined = no limit, or an integer >= 0 to set the limit
                window.ENABLE_PRIVACY_POLICY_AND_TOS = window.famobi.hasFeature("privacy"); //set to true to enable ToS and Privacy Policy buttons in game setting menu
                window.OPEN_TERMS_OF_SERVICE = () => window.open('https://famobi.com/terms-of-service'); //replace with an actual link
                window.OPEN_PRIVACY_POLICY = () => window.open('https://famobi.com/privacy'); //replace with an actual link
                window.SHARE_GAME_CALLBACK = () => window.open('https://famobi.com')
            },
            "preloader.js",
            "playcanvas-stable.min.js",
            "__settings__.js",
            "__modules__.js",
            "__start__.js",
            "__loading__.js"
        ];
        (function (document, url, fgJS, firstJS) {
            fgJS = document.createElement('script');
            firstJS = document.getElementsByTagName('script')[0];
            fgJS.src = url + encodeURIComponent(document.location.href);
            firstJS.parentNode.insertBefore(fgJS, firstJS);
        })(document, '//games.cdn.famobi.com/html5games/gameapi/v1.js?e=');         
    </script>
