<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Support Desk — iframe harness</title></head>
<body>
  <!-- ?mock=1 so the bench works with no engine; drop it to hit the real supportsim API. -->
  <iframe id="game" src="index.html?mock=1&autostart=1" allow="autoplay; microphone"></iframe>
  <aside id="panel"></aside>
  <script>
    window.HARNESS = {
      slug: 'support-desk',
      params: [
        {name:'customer_patience',default:0.7},
        {name:'hostility',default:0.3},
        {name:'ambiguity',default:0.3},
        {name:'concurrency',default:1},
        {name:'policy_complexity',default:1},
        {name:'incongruence_rate',default:0},
        {name:'speech_rate',default:1},
        {name:'interruption_rate',default:0},
        {name:'policy_switch',default:0},
      ],
      presets: {
        1:{customer_patience:1,hostility:0,ambiguity:0,concurrency:1,policy_complexity:1,policy_switch:0},   // relax
        2:{customer_patience:0.85,hostility:0.15,ambiguity:0.2,concurrency:1},
        3:{customer_patience:0.7,hostility:0.3,ambiguity:0.3,concurrency:1,policy_complexity:1},               // focus (defaults)
        4:{concurrency:2,ambiguity:0.5},
        5:{customer_patience:0.5,hostility:0.5,ambiguity:0.5,concurrency:2,policy_complexity:2},
        6:{policy_switch:1},
        7:{incongruence_rate:1,speech_rate:1.1},                                                                // empathy
        8:{customer_patience:0.35,hostility:0.7,concurrency:3,policy_complexity:3},                            // grit
        9:{customer_patience:0.2,hostility:1,ambiguity:0.9,concurrency:3,policy_complexity:3,policy_switch:1},
      },
      readState: (w) => ({ ...w.__deskState, tuning: w.__deskTuning, harness: w.__harness ? w.__harness.getState() : null }),
    };
  </script>
  <script src="../../_shared/harness.js"></script>
</body></html>
