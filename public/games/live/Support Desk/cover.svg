<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Support Desk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0f1218"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ccf91"/>
      <stop offset="0.5" stop-color="#f5b84b"/>
      <stop offset="1" stop-color="#f06a6a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- desk grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H600M0 160H600M0 240H600M0 320H600M100 0V400M200 0V400M300 0V400M400 0V400M500 0V400"/>
  </g>
  <!-- customer bubble (tense) -->
  <g transform="translate(70 92)">
    <path d="M0 18a18 18 0 0 1 18-18h214a18 18 0 0 1 18 18v52a18 18 0 0 1-18 18H44l-30 24v-24H18A18 18 0 0 1 0 70z" fill="#1c2230" stroke="#f5b84b" stroke-width="2"/>
    <rect x="22" y="24" width="170" height="10" rx="5" fill="#e8ecf3" opacity="0.8"/>
    <rect x="22" y="44" width="120" height="10" rx="5" fill="#e8ecf3" opacity="0.5"/>
    <circle cx="222" cy="29" r="7" fill="#f5b84b"/>
  </g>
  <!-- agent bubble -->
  <g transform="translate(290 206)">
    <path d="M0 18a18 18 0 0 1 18-18h204a18 18 0 0 1 18 18v52a18 18 0 0 1-18 18h-18v24l-30-24H18A18 18 0 0 1 0 70z" fill="#2a3f7a"/>
    <rect x="22" y="24" width="150" height="10" rx="5" fill="#ffffff" opacity="0.85"/>
    <rect x="22" y="44" width="180" height="10" rx="5" fill="#ffffff" opacity="0.55"/>
  </g>
  <!-- patience meter -->
  <g transform="translate(70 300)">
    <rect x="0" y="0" width="230" height="10" rx="5" fill="#ffffff" opacity="0.12"/>
    <rect x="0" y="0" width="150" height="10" rx="5" fill="url(#hot)"/>
    <text x="0" y="36" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2" fill="#e8ecf3" opacity="0.7">PATIENCE</text>
  </g>
  <!-- confidence dial -->
  <g transform="translate(470 110)">
    <circle r="46" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10"/>
    <circle r="46" fill="none" stroke="#5b8cff" stroke-width="10" stroke-linecap="round" stroke-dasharray="202 289" transform="rotate(-90)"/>
    <text text-anchor="middle" y="7" font-family="ui-monospace, Menlo, monospace" font-size="20" font-weight="700" fill="#e8ecf3">70%</text>
    <text text-anchor="middle" y="72" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2" fill="#e8ecf3" opacity="0.7">SURE?</text>
  </g>
  <!-- title -->
  <text x="300" y="372" text-anchor="middle" font-family="-apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e8ecf3" letter-spacing="1">Support Desk</text>
</svg>
