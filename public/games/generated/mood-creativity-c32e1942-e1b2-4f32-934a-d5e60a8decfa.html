<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Mood Game</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0; font-family: Arial, sans-serif; }
        canvas { border: 1px solid black; }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="400" height="400"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let moodColor = '#ffcccb'; // Light pink for a calm start

    function drawMood() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = moodColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Change my mood!', canvas.width / 2, canvas.height / 2);
    }

    function changeMood() {
        const colors = ['#ffcccb', '#add8e6', '#90ee90', '#ffd700', '#ff4500']; // Light pink, light blue, light green, yellow, red
        moodColor = colors[Math.floor(Math.random() * colors.length)];
    }

    canvas.addEventListener('click', changeMood);

    drawMood();
</script>
</body>
</html>
