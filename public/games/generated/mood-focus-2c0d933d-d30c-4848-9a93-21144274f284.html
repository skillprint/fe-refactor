<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Focus Runner</title>
    <meta name="game-icon" content="🐔">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
    <script src="/games/lib/skillprint-adjustment.js"></script>
    <style>
        @font-face {
            font-family: 'PixelFont';
            src: url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 6px solid #333;
            image-rendering: pixelated;
        }
        canvas {
            display: block;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border: 4px solid #fff;
            pointer-events: auto;
            text-align: center;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .screen.active {
            display: flex;
        }
        h1 { font-size: 32px; margin-bottom: 20px; color: #ffeb3b; letter-spacing: 2px; }
        p { font-size: 16px; margin-bottom: 30px; line-height: 1.5; color: #ddd; }
        button {
            padding: 12px 24px;
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            background: #4caf50;
            border: none;
            color: white;
            border-bottom: 5px solid #2e7d32;
            transition: all 0.1s;
            text-transform: uppercase;
        }
        button:hover { background: #66bb6a; }
        button:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px #000;
            display: none;
        }
        .stat-box {
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border: 2px solid #fff;
        }
    </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="/games/lib/skillprint-adjustment.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div id="hud">
                <div class="stat-box">DIST: <span id="score-val">0</span></div>
                <div class="stat-box">SPEED: <span id="speed-val">1.0</span>x</div>
            </div>
            
            <div id="start-screen" class="screen active">
                <h1>PIXEL CHICKEN</h1>
                <p>FOCUS ON THE PATH.<br>DODGE TRAFFIC. CROSS RIVERS.<br>STAY ON SCREEN.<br><br><b>ARROWS TO MOVE</b></p>
                <button onclick="startGame()">ENTER FLOW</button>
            </div>

            <div id="game-over-screen" class="screen">
                <h1 id="game-over-title">FLOW BROKEN</h1>
                <p id="final-score">DISTANCE: 0</p>
                <button onclick="startGame()">RETRY</button>
            </div>
        </div>
    </div>

<script>
/**
 * PIXEL FOCUS RUNNER
 * Designed for sustained attention and rhythmic flow.
 */

// Global Adjustable Configuration
window.GAME_CONFIG = {
    worldScrollSpeed: 1.2,
    playerSpeed: 250,
    spawnRate: 0.4,
    carSpeedMin: 100,
    carSpeedMax: 200,
    laneHeight: 64,
    difficultyScale: 0.05
};

window.adjustGame = function(obj) {
    if (typeof obj === 'object' && obj.hasOwnProperty('parameterName')) {
        const { parameterName, parameterValue } = obj;
        if (window.GAME_CONFIG.hasOwnProperty(parameterName)) {
            window.GAME_CONFIG[parameterName] = parameterValue;
            console.log(`Adjusted ${parameterName} to ${parameterValue}`);
        }
    }
}

window.Skillprint.registerAdjustments({
    '1': { parameterName: 'worldScrollSpeed', description: 'Slower Scroll', value: 0.8 },
    '2': { parameterName: 'worldScrollSpeed', description: 'Faster Scroll', value: 2.5 },
    '3': { parameterName: 'playerSpeed', description: 'Slower Player', value: 150 },
    '4': { parameterName: 'playerSpeed', description: 'Faster Player', value: 400 },
    '5': { parameterName: 'spawnRate', description: 'Less Traffic', value: 0.2 },
    '6': { parameterName: 'spawnRate', description: 'More Traffic', value: 0.7 },
    '7': { parameterName: 'carSpeedMax', description: 'Slower Cars', value: 100 },
    '8': { parameterName: 'carSpeedMax', description: 'Faster Cars', value: 350 },
    '9': { parameterName: 'difficultyScale', description: 'No Scaling', value: 0 }
});

// Assets (Pixel Art SVG URIs)
const ASSETS = {
    chicken: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiIgc2hhcGUtcmVuZGVyaW5nPSJjcmlzcEVkZ2VzIj48cmVjdCB3aWR0aD0iMTIiIGhlaWdodD0iMTAiIHg9IjIiIHk9IjQiIGZpbGw9IiNmZmYiIC8+PHJlY3Qgd2lkdGg9IjgiIGhlaWdodD0iMiIgeD0iNCIgeT0iMiIgZmlsbD0iI2ZmZiIgLz48cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSIyIiB4PSI2IiB5PSIwIiBmaWxsPSIjZjc0YzRjIiAvPjxyZWN0IHdpZHRoPSIyIiBoZWlnaHQ9IjIiIHg9IjEwIiB5PSI2IiBmaWxsPSIjMDAwIiAvPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjIiIHg9IjEyIiB5PSI4IiBmaWxsPSIjZjM5YzEyIiAvPjxyZWN0IHdpZHRoPSIyIiBoZWlnaHQ9IjQiIHg9IjQiIHk9IjEyIiBmaWxsPSIjZjM5YzEyIiAvPjxyZWN0IHdpZHRoPSIyIiBoZWlnaHQ9IjQiIHg9IjEwIiB5PSIxMiIgZmlsbD0iI2YzOWMxMiIgLz48L3N2Zz4=',
    car: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAxNiIgc2hhcGUtcmVuZGVyaW5nPSJjcmlzcEVkZ2VzIj48cmVjdCB3aWR0aD0iMjQiIGhlaWdodD0iMTIiIHg9IjQiIHk9IjIiIGZpbGw9IiNlNzRjM2MiIC8+PHJlY3Qgd2lkdGg9IjgiIGhlaWdodD0iNiIgeD0iOCIgeT0iNCIgZmlsbD0iIzM0OThkYiIgLz48cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiB4PSI2IiB5PSIxMiIgZmlsbD0iIzMzMyIgLz48cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiB4PSIyMiIgeT0iMTIiIGZpbGw9IiMzMzMiIC8+PHJlY3Qgd2lkdGg9IjIiIGhlaWdodD0iMiIgeD0iMjgiIHk9IjYiIGZpbGw9IiNmMWN0MGYiIC8+PC9zdmc+',
    log: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA4IiBzaGFwZS1yZW5kZXJpbmc9ImNyaXNwRWRnZXMiPjxyZWN0IHdpZHRoPSI0OCIgaGVpZ2h0PSI4IiBmaWxsPSIjOGU0NDFkIiAvPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjgiIHg9IjQiIGZpbGw9IiM2ZDM4MTciIC8+PHJlY3Qgd2lkdGg9IjgiIGhlaWdodD0iOCIgeD0iMjAiIGZpbGw9IiM2ZDM4MTciIC8+PHJlY3Qgd2lkdGg9IjQiIGhlaWdodD0iOCIgeD0iNDAiIGZpbGw9IiM2ZDM4MTciIC8+PC9zdmc+',
    tree: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiIgc2hhcGUtcmVuZGVyaW5nPSJjcmlzcEVkZ2VzIj48cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiB4PSI2IiB5PSIxMiIgZmlsbD0iIzdjNWU0MiIgLz48cmVjdCB3aWR0aD0iMTIiIGhlaWdodD0iMTIiIHg9IjIiIHk9IjAiIGZpbGw9IiMyN2FlNjAiIC8+PHJlY3Qgd2lkdGg9IjgiIGhlaWdodD0iOCIgeD0iNCIgeT0iMiIgZmlsbD0iIzJlY2M3MSIgLz48L3N2Zz4='
};

class MainScene extends Phaser.Scene {
    constructor() {
        super('MainScene');
        this.score = 0;
        this.isGameOver = false;
        this.lanes = [];
        this.laneCounter = 0;
        this.difficultyTimer = 0;
    }

    preload() {
        this.load.image('chicken', ASSETS.chicken);
        this.load.image('car', ASSETS.car);
        this.load.image('log', ASSETS.log);
        this.load.image('tree', ASSETS.tree);
    }

    create() {
        this.isGameOver = false;
        this.score = 0;
        this.laneCounter = 0;
        this.difficultyTimer = 0;
        this.lanes = [];

        // Groups
        this.laneGroup = this.add.group();
        this.obstacleGroup = this.physics.add.group();
        this.logGroup = this.physics.add.group();
        this.treeGroup = this.physics.add.staticGroup();

        // Player
        this.player = this.physics.add.sprite(this.scale.width / 2, this.scale.height - 120, 'chicken');
        this.player.setOrigin(0.5, 0.5);
        this.player.setDisplaySize(32, 32);
        this.player.setCollideWorldBounds(true);
        this.player.depth = 100;
        this.player.body.setSize(24, 24);

        // Initial Lane Generation
        for (let i = 0; i < 12; i++) {
            this.spawnLane(this.scale.height - (i * window.GAME_CONFIG.laneHeight));
        }

        // Controls
        this.cursors = this.input.keyboard.createCursorKeys();

        // Physics
        this.physics.add.overlap(this.player, this.obstacleGroup, this.hitObstacle, null, this);
        this.physics.add.collider(this.player, this.treeGroup);

        // HUD
        document.getElementById('hud').style.display = 'flex';
        this.updateHUD();
    }

    spawnLane(y) {
        const types = ['grass', 'road', 'water'];
        let type = 'grass';
        
        if (this.laneCounter > 3) {
            type = types[Phaser.Math.Between(0, 2)];
        }

        const lane = this.add.container(0, y);
        lane.laneType = type;
        
        let color = 0x2ecc71;
        if (type === 'road') color = 0x34495e;
        if (type === 'water') color = 0x3498db;

        const bg = this.add.rectangle(0, 0, this.scale.width, window.GAME_CONFIG.laneHeight, color).setOrigin(0, 0);
        lane.add(bg);

        // Lane Decor / Obstacles
        if (type === 'road') {
            const stripe = this.add.rectangle(0, window.GAME_CONFIG.laneHeight / 2 - 2, this.scale.width, 4, 0xf1c40f, 0.5).setOrigin(0, 0);
            lane.add(stripe);
            this.spawnMovingObject(y, 'car');
        } else if (type === 'water') {
            this.spawnMovingObject(y, 'log');
        } else if (type === 'grass' && this.laneCounter > 1) {
            if (Math.random() < 0.3) this.spawnStaticObject(y, 'tree');
        }

        this.laneGroup.add(lane);
        this.lanes.push(lane);
        this.laneCounter++;
    }

    spawnMovingObject(y, type) {
        if (Math.random() > window.GAME_CONFIG.spawnRate) return;

        const direction = Math.random() > 0.5 ? 1 : -1;
        const speed = Phaser.Math.Between(window.GAME_CONFIG.carSpeedMin, window.GAME_CONFIG.carSpeedMax) * direction;
        const startX = direction === 1 ? -64 : this.scale.width + 64;
        
        const obj = this.physics.add.sprite(startX, y + window.GAME_CONFIG.laneHeight / 2, type);
        obj.setDisplaySize(type === 'log' ? 96 : 48, 32);
        obj.setVelocityX(speed);
        obj.direction = direction;
        obj.laneY = y;
        
        if (type === 'car') {
            this.obstacleGroup.add(obj);
            if (direction === -1) obj.setFlipX(true);
        } else {
            this.logGroup.add(obj);
            obj.setAlpha(0.9);
        }
    }

    spawnStaticObject(y, type) {
        const x = Phaser.Math.Between(40, this.scale.width - 40);
        const tree = this.treeGroup.create(x, y + window.GAME_CONFIG.laneHeight / 2, type);
        tree.setDisplaySize(32, 32);
        tree.refreshBody();
        tree.laneY = y;
    }

    updateHUD() {
        document.getElementById('score-val').innerText = Math.floor(this.score);
        document.getElementById('speed-val').innerText = window.GAME_CONFIG.worldScrollSpeed.toFixed(1);
    }

    hitObstacle() {
        this.gameOver();
    }

    gameOver() {
        if (this.isGameOver) return;
        this.isGameOver = true;
        this.physics.pause();
        this.player.setTint(0xff0000);
        
        document.getElementById('game-over-screen').classList.add('active');
        document.getElementById('final-score').innerText = `DISTANCE: ${Math.floor(this.score)}`;
        document.getElementById('hud').style.display = 'none';
    }

    update(time, delta) {
        if (this.isGameOver) return;

        // Difficulty Scaling
        this.difficultyTimer += delta;
        if (this.difficultyTimer > 5000) {
            window.GAME_CONFIG.worldScrollSpeed += window.GAME_CONFIG.difficultyScale;
            this.difficultyTimer = 0;
            this.updateHUD();
        }

        // World Scrolling
        const scroll = window.GAME_CONFIG.worldScrollSpeed;
        this.score += scroll * 0.1;
        this.updateHUD();

        // Move Player with screen
        this.player.y += scroll;

        // Player Controls
        this.player.setVelocity(0);
        if (this.cursors.left.isDown) this.player.setVelocityX(-window.GAME_CONFIG.playerSpeed);
        else if (this.cursors.right.isDown) this.player.setVelocityX(window.GAME_CONFIG.playerSpeed);
        
        if (this.cursors.up.isDown) this.player.setVelocityY(-window.GAME_CONFIG.playerSpeed + scroll);
        else if (this.cursors.down.isDown) this.player.setVelocityY(window.GAME_CONFIG.playerSpeed + scroll);

        // Lane Recycling
        this.lanes.forEach(lane => {
            lane.y += scroll;
        });

        const topLane = this.lanes[this.lanes.length - 1];
        if (topLane.y > 0) {
            this.spawnLane(topLane.y - window.GAME_CONFIG.laneHeight);
        }

        // Cleanup lanes and objects
        this.lanes = this.lanes.filter(lane => {
            if (lane.y > this.scale.height + 100) {
                lane.destroy();
                return false;
            }
            return true;
        });

        // Update object positions with scroll
        [this.obstacleGroup, this.logGroup, this.treeGroup].forEach(group => {
            group.children.iterate(child => {
                if (child) {
                    child.y += scroll;
                    // Wrap moving objects
                    if (child.direction) {
                        if (child.direction === 1 && child.x > this.scale.width + 100) child.x = -100;
                        if (child.direction === -1 && child.x < -100) child.x = this.scale.width + 100;
                    }
                    // Kill far offscreen
                    if (child.y > this.scale.height + 200) child.destroy();
                }
            });
        });

        // Water/Log Logic
        let onLog = false;
        this.physics.overlap(this.player, this.logGroup, (p, log) => {
            p.x += log.body.velocity.x * (delta / 1000);
            onLog = true;
        });

        const playerLane = this.lanes.find(l => 
            this.player.y >= l.y && this.player.y <= l.y + window.GAME_CONFIG.laneHeight
        );

        if (playerLane && playerLane.laneType === 'water' && !onLog) {
            this.gameOver();
        }

        // Bounds Check
        if (this.player.y > this.scale.height || this.player.y < -50) {
            this.gameOver();
        }
    }
}

const config = {
    type: Phaser.AUTO,
    width: 400,
    height: 600,
    parent: 'game-container',
    pixelArt: true,
    physics: {
        default: 'arcade',
        arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: MainScene
};

let game;

function startGame() {
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('game-over-screen').classList.remove('active');
    
    // Reset config to defaults or current adjustments
    if (game) {
        game.destroy(true);
    }
    game = new Phaser.Game(config);
}
</script>
</body>
</html>
