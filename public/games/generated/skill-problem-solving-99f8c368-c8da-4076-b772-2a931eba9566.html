<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Math Quiz</title>
    <meta name="game-icon" content="🎮">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #question { font-size: 24px; margin-bottom: 20px; }
        input[type="number"] { width: 100px; padding: 10px; font-size: 18px; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; }
        #result { margin-top: 20px; font-size: 20px; color: red; }
    </style>
</head>
<body>

<h1>Quick Math Quiz</h1>
<div id="question">What is 17 + 23?</div>
<input type="number" id="answer">
<button onclick="checkAnswer()">Submit</button>
<div id="result"></div>

<script>
    function checkAnswer() {
        const userAnswer = parseInt(document.getElementById('answer').value);
        const correctAnswer = 40;
        const resultDiv = document.getElementById('result');
        
        if (userAnswer === correctAnswer) {
            resultDiv.textContent = 'Correct! 🎉';
            resultDiv.style.color = 'green';
        } else {
            resultDiv.textContent = `Wrong! The answer is ${correctAnswer}. Try again.`;
        }
    }
</script>

</body>
</html>
