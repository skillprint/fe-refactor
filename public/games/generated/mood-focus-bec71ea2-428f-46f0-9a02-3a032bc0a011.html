<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Focus</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --bg-color: #0d0e15;
            --text-color: #ffffff;
            --accent-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .score-container {
            display: flex;
            flex-direction: column;
        }

        #score {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
        }

        #combo {
            font-size: 1.2rem;
            font-weight: 700;
            color: #8892b0;
            margin-top: 5px;
        }

        .lives-container {
            display: flex;
            gap: 10px;
        }

        .life {
            width: 15px;
            height: 15px;
            background-color: var(--text-color);
            border-radius: 50%;
            transition: transform 0.2s, opacity 0.2s;
        }

        .life.lost {
            opacity: 0.2;
            transform: scale(0.5);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(13, 14, 21, 0.9);
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #8892b0;
            margin-bottom: 40px;
        }

        .instructions {
            font-size: 1.1rem;
            color: #a8b2d1;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.5;
        }

        .blink {
            animation: blinker 1.5s linear infinite;
            font-weight: 700;
            font-size: 1.2rem;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        .debug-panel {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 0.7rem;
            color: #555;
            font-family: monospace;
            pointer-events: none;
            z-index: 30;
        }

    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-top" id="hud">
            <div class="score-container">
                <div id="score">0</div>
                <div id="combo">x1 Multiplier</div>
            </div>
            <div class="lives-container" id="lives">
                <div class="life"></div>
                <div class="life"></div>
                <div class="life"></div>
            </div>
        </div>
    </div>

    <div id="startScreen" class="screen">
        <h1>Orbital Focus</h1>
        <div class="instructions">
            Align the core to absorb incoming data.<br>
            Use <strong>LEFT / RIGHT Arrows</strong> or <strong>A / D</strong> to rotate.<br>
            Match colors to survive.
        </div>
        <div class="blink">PRESS SPACE TO INITIATE</div>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h1>Signal Lost</h1>
        <h2 id="finalScore">Score: 0</h2>
        <div class="blink">PRESS SPACE TO RESTART</div>
    </div>

    <div class="debug-panel">
        Adjustability Test Keys: 1-3 (Speed), 4-6 (Spawn Rate), 7-9 (Rotation Speed)
    </div>

    <script>
        /**
         * GAME CONFIGURATION & ADJUSTABILITY
         * These parameters dictate the feel and difficulty of the game.
         */
        window.GAME_CONFIG = {
            particleSpeed: 3.0,      // Base speed of incoming particles
            spawnInterval: 1200,     // MS between spawns initially
            rotationSpeed: 0.08,     // Speed of core rotation per frame
            difficultyRamp: 0.98,    // Multiplier applied to spawn interval on success
            speedRamp: 1.02,         // Multiplier applied to particle speed on success
            minSpawnInterval: 350,   // Cap for how fast particles can spawn
            maxParticleSpeed: 12.0   // Cap for particle speed
        };

        // Standard interface for external adjustments
        window.adjustGame = function(obj) {
            if (typeof obj === 'object' && obj.hasOwnProperty('parameterName')) {
                const { parameterName, parameterValue } = obj;
                if (window.GAME_CONFIG.hasOwnProperty(parameterName)) {
                    window.GAME_CONFIG[parameterName] = parameterValue;
                    console.log(`[Game] Adjusted ${parameterName} to ${parameterValue}`);
                    
                    // Notify parent window
                    if (window.parent) {
                        window.parent.postMessage({ 
                            type: 'ADJUSTMENT_MADE', 
                            parameterName, 
                            parameterValue 
                        }, '*');
                    }
                }
            }
        };

        // Keyboard hooks for testing adjustments (Keys 1-9)
        window.addEventListener('keydown', function(event) {
            switch(event.key) {
                // Speed Adjustments
                case '1': window.adjustGame({ parameterName: 'particleSpeed', parameterValue: 1.5 }); break;
                case '2': window.adjustGame({ parameterName: 'particleSpeed', parameterValue: 3.0 }); break;
                case '3': window.adjustGame({ parameterName: 'particleSpeed', parameterValue: 6.0 }); break;
                // Spawn Rate Adjustments
                case '4': window.adjustGame({ parameterName: 'spawnInterval', parameterValue: 2000 }); break;
                case '5': window.adjustGame({ parameterName: 'spawnInterval', parameterValue: 1200 }); break;
                case '6': window.adjustGame({ parameterName: 'spawnInterval', parameterValue: 500 }); break;
                // Rotation Speed Adjustments
                case '7': window.adjustGame({ parameterName: 'rotationSpeed', parameterValue: 0.04 }); break;
                case '8': window.adjustGame({ parameterName: 'rotationSpeed', parameterValue: 0.08 }); break;
                case '9': window.adjustGame({ parameterName: 'rotationSpeed', parameterValue: 0.15 }); break;
            }
        });

        /**
         * ENGINE & STATE
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const uiScore = document.getElementById('score');
        const uiCombo = document.getElementById('combo');
        const uiLives = document.getElementById('lives');
        const hud = document.getElementById('hud');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');

        // Game State Variables
        let width, height, cx, cy;
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let combo = 1;
        let lives = 3;
        let lastTime = 0;
        let timeSinceLastSpawn = 0;
        let animationFrameId;

        // Visual Assets (Minimalist Vector Colors)
        const COLORS = ['#FF2A55', '#2A55FF', '#2AFF88']; // Pinkish-Red, Blue, Green
        const BG_COLOR = '#0d0e15';

        // Entities
        let coreRotation = 0;
        const coreRadius = 60;
        const coreThickness = 20;
        let particles = [];
        let visualEffects = [];

        // Input State
        const keys = {
            left: false,
            right: false
        };

        /**
         * INITIALIZATION & RESIZING
         */
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * INPUT HANDLING
         */
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            
            if (e.code === 'Space') {
                if (gameState === 'START') startGame();
                else if (gameState === 'GAMEOVER') resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        /**
         * GAME LOGIC
         */
        function startGame() {
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            hud.style.opacity = 1;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            score = 0;
            combo = 1;
            lives = 3;
            particles = [];
            visualEffects = [];
            coreRotation = 0;
            
            // Reset config to defaults
            window.GAME_CONFIG.particleSpeed = 3.0;
            window.GAME_CONFIG.spawnInterval = 1200;
            
            updateUI();
            
            // Reset life UI
            const lifeElements = uiLives.children;
            for(let i=0; i<lifeElements.length; i++) {
                lifeElements[i].classList.remove('lost');
            }

            gameState = 'PLAYING';
            gameOverScreen.classList.add('hidden');
            hud.style.opacity = 1;
            lastTime = performance.now();
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            hud.style.opacity = 0;
            gameOverScreen.classList.remove('hidden');
            finalScoreEl.innerText = `Score: ${score}`;
        }

        function spawnParticle() {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.max(width, height) * 0.7; // Spawn outside screen
            const x = cx + Math.cos(angle) * distance;
            const y = cy + Math.sin(angle) * distance;
            const colorIndex = Math.floor(Math.random() * COLORS.length);
            
            particles.push({
                x: x,
                y: y,
                colorIndex: colorIndex,
                color: COLORS[colorIndex],
                radius: 8,
                speed: window.GAME_CONFIG.particleSpeed
            });
        }

        function createExplosion(x, y, color) {
            visualEffects.push({
                type: 'ring',
                x: x,
                y: y,
                color: color,
                radius: coreRadius,
                maxRadius: coreRadius + 40,
                alpha: 1,
                decay: 0.05
            });
        }

        function updateUI() {
            uiScore.innerText = score;
            uiCombo.innerText = `x${combo} Multiplier`;
            
            const lifeElements = uiLives.children;
            for(let i=0; i<3; i++) {
                if (i >= lives) {
                    lifeElements[2-i].classList.add('lost');
                }
            }
        }

        function update(dt) {
            // Handle Rotation
            if (keys.left) coreRotation -= window.GAME_CONFIG.rotationSpeed;
            if (keys.right) coreRotation += window.GAME_CONFIG.rotationSpeed;
            
            // Normalize rotation
            coreRotation = coreRotation % (Math.PI * 2);
            if (coreRotation < 0) coreRotation += Math.PI * 2;

            // Spawning Logic
            timeSinceLastSpawn += dt;
            if (timeSinceLastSpawn > window.GAME_CONFIG.spawnInterval) {
                spawnParticle();
                timeSinceLastSpawn = 0;
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                
                // Move towards center
                const dx = cx - p.x;
                const dy = cy - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                const moveX = (dx / dist) * p.speed;
                const moveY = (dy / dist) * p.speed;
                
                p.x += moveX;
                p.y += moveY;

                // Collision Detection
                if (dist <= coreRadius + coreThickness/2 + p.radius) {
                    // Calculate angle of impact
                    let impactAngle = Math.atan2(p.y - cy, p.x - cx);
                    if (impactAngle < 0) impactAngle += Math.PI * 2;

                    // Adjust for core rotation
                    let effectiveAngle = (impactAngle - coreRotation) % (Math.PI * 2);
                    if (effectiveAngle < 0) effectiveAngle += Math.PI * 2;

                    const segmentAngle = (Math.PI * 2) / COLORS.length;
                    const hitIndex = Math.floor(effectiveAngle / segmentAngle);

                    if (hitIndex === p.colorIndex) {
                        // Success
                        score += 10 * combo;
                        combo++;
                        createExplosion(cx, cy, p.color);
                        
                        // Ramp difficulty slightly
                        window.GAME_CONFIG.spawnInterval = Math.max(
                            window.GAME_CONFIG.minSpawnInterval, 
                            window.GAME_CONFIG.spawnInterval * window.GAME_CONFIG.difficultyRamp
                        );
                        window.GAME_CONFIG.particleSpeed = Math.min(
                            window.GAME_CONFIG.maxParticleSpeed,
                            window.GAME_CONFIG.particleSpeed * window.GAME_CONFIG.speedRamp
                        );
                        
                    } else {
                        // Fail
                        combo = 1;
                        lives--;
                        
                        // Visual feedback for fail (shake or flash - keeping it minimal vector: just red flash)
                        visualEffects.push({
                            type: 'flash',
                            alpha: 0.3,
                            decay: 0.02
                        });
                        
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                    
                    updateUI();
                    particles.splice(i, 1);
                }
            }

            // Update Effects
            for (let i = visualEffects.length - 1; i >= 0; i--) {
                let eff = visualEffects[i];
                if (eff.type === 'ring') {
                    eff.radius += 2;
                    eff.alpha -= eff.decay;
                    if (eff.alpha <= 0) visualEffects.splice(i, 1);
                } else if (eff.type === 'flash') {
                    eff.alpha -= eff.decay;
                    if (eff.alpha <= 0) visualEffects.splice(i, 1);
                }
            }
        }

        /**
         * RENDERING
         */
        function draw() {
            // Clear screen
            ctx.fillStyle = BG_COLOR;
            ctx.fillRect(0, 0, width, height);

            // Draw Effects (Flash)
            visualEffects.forEach(eff => {
                if (eff.type === 'flash') {
                    ctx.fillStyle = `rgba(255, 0, 0, ${eff.alpha})`;
                    ctx.fillRect(0, 0, width, height);
                }
            });

            // Draw Core
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(coreRotation);
            
            const numSegments = COLORS.length;
            const angleStep = (Math.PI * 2) / numSegments;
            
            for(let i=0; i<numSegments; i++) {
                ctx.beginPath();
                ctx.arc(0, 0, coreRadius + coreThickness/2, i * angleStep, (i+1) * angleStep);
                ctx.arc(0, 0, coreRadius - coreThickness/2, (i+1) * angleStep, i * angleStep, true);
                ctx.fillStyle = COLORS[i];
                ctx.fill();
            }
            
            // Draw inner core center
            ctx.beginPath();
            ctx.arc(0, 0, coreRadius - coreThickness/2 - 5, 0, Math.PI * 2);
            ctx.fillStyle = '#1a1c29';
            ctx.fill();
            
            ctx.restore();

            // Draw Effects (Rings)
            visualEffects.forEach(eff => {
                if (eff.type === 'ring') {
                    ctx.beginPath();
                    ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = eff.color;
                    ctx.lineWidth = 4;
                    ctx.globalAlpha = eff.alpha;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }
            });

            // Draw Particles
            particles.forEach(p => {
                // Trail
                ctx.beginPath();
                const angle = Math.atan2(cy - p.y, cx - p.x);
                const trailX = p.x - Math.cos(angle) * 15;
                const trailY = p.y - Math.sin(angle) * 15;
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(trailX, trailY);
                ctx.strokeStyle = p.color;
                ctx.lineWidth = p.radius * 2;
                ctx.lineCap = 'round';
                ctx.globalAlpha = 0.4;
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                // Head
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });
        }

        /**
         * MAIN LOOP
         */
        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;

            const dt = timestamp - lastTime;
            lastTime = timestamp;

            // Cap dt to prevent massive jumps if tab is inactive
            if (dt < 100) {
                update(dt);
                draw();
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // Initial draw for background
        draw();

    </script>
</body>
</html>
