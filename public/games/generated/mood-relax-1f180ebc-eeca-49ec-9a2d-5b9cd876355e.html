<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drift - Relaxing Synthwave Platformer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050011; /* Deep synthwave dark purple */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), 0 0 60px rgba(255, 0, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(5, 0, 17, 0.85);
            padding: 40px;
            border-radius: 16px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff, inset 0 0 20px #ff00ff;
            text-align: center;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            transition: opacity 1s ease-in-out;
        }
        .screen.active {
            display: flex;
            animation: fadeIn 1s ease-in-out;
        }
        h1 {
            color: #fff;
            font-size: 3rem;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
        }
        p {
            color: #aaeaff;
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-shadow: 0 0 5px #00ffff;
        }
        button {
            background: transparent;
            color: #fff;
            border: 2px solid #ff00ff;
            padding: 15px 40px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 30px;
            box-shadow: 0 0 10px #ff00ff, inset 0 0 10px #ff00ff;
            transition: all 0.3s ease;
            outline: none;
        }
        button:hover {
            background: #ff00ff;
            color: #050011;
            box-shadow: 0 0 20px #ff00ff, inset 0 0 20px #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
    <!-- Phaser 3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
    <!-- Skillprint Library -->
    <script src="/games/lib/skillprint-adjustment.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="/games/lib/skillprint-adjustment.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="start-screen" class="screen active">
            <h1>Neon Drift</h1>
            <p>A relaxing journey through the grid.<br>Use Arrow Keys or A/D to move. Space to float.</p>
            <button onclick="startGame()">Drift Away</button>
        </div>
        <div id="win-screen" class="screen">
            <h1>Ascension</h1>
            <p>You have reached the end of the line.<br>Feel the calm.</p>
            <button onclick="restartGame()">Loop Again</button>
        </div>
    </div>

<script>
    // ==========================================
    // ADJUSTABLE PARAMETERS & SKILLPRINT SETUP
    // ==========================================
    window.GAME_PARAMS = {
        player_speed: 180,       // Horizontal movement speed
        jump_force: -320,        // Upward force applied on jump
        gravity: 300,            // World gravity (low for floaty feel)
        glow_intensity: 1.2,     // Visual bloom intensity
        air_control: 0.8         // Factor of speed while in air
    };

    window.adjustGame = function(obj) {
        if (typeof obj === 'object' && obj.hasOwnProperty('parameterName')) {
            const { parameterName, parameterValue } = obj;
            window.GAME_PARAMS[parameterName] = parameterValue;
            console.log(`Adjusted ${parameterName} to ${parameterValue}`);

            // Apply physics changes immediately if game is running
            if (window.gameInstance) {
                const gameScene = window.gameInstance.scene.getScene('GameScene');
                if (gameScene && gameScene.player && gameScene.player.active) {
                    if (parameterName === 'gravity') {
                        gameScene.player.body.setGravityY(window.GAME_PARAMS.gravity);
                    }
                }
                const bootScene = window.gameInstance.scene.getScene('BootScene');
                if (bootScene && parameterName === 'glow_intensity') {
                    // Updating visual params might require scene restart or dynamic update
                    // For simplicity, we just log it, it will apply on next spawn/fx creation
                }
            }
        }
    };

    // Register with Skillprint on load
    window.onload = function() {
        if (window.Skillprint && typeof window.Skillprint.registerAdjustments === 'function') {
            window.Skillprint.registerAdjustments({
                '1': { parameterName: 'player_speed', description: 'Slower Movement', value: 120 },
                '2': { parameterName: 'player_speed', description: 'Normal Movement', value: 180 },
                '3': { parameterName: 'player_speed', description: 'Faster Movement', value: 250 },
                '4': { parameterName: 'gravity', description: 'Moon Gravity (Very Floaty)', value: 150 },
                '5': { parameterName: 'gravity', description: 'Normal Gravity', value: 300 },
                '6': { parameterName: 'gravity', description: 'Heavy Gravity', value: 600 },
                '7': { parameterName: 'jump_force', description: 'Weak Jump', value: -250 },
                '8': { parameterName: 'jump_force', description: 'Normal Jump', value: -320 },
                '9': { parameterName: 'jump_force', description: 'High Jump', value: -450 }
            });
        }
    };

    // ==========================================
    // UI CONTROL
    // ==========================================
    function hideAllScreens() {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    }

    function startGame() {
        hideAllScreens();
        if (window.gameInstance) {
            window.gameInstance.scene.start('GameScene');
            window.gameInstance.scene.start('UIScene');
        }
    }

    function restartGame() {
        hideAllScreens();
        if (window.gameInstance) {
            window.gameInstance.scene.start('GameScene');
            window.gameInstance.scene.getScene('UIScene').resetScore();
        }
    }

    function showWinScreen() {
        hideAllScreens();
        document.getElementById('win-screen').classList.add('active');
        window.gameInstance.scene.stop('GameScene');
        window.gameInstance.scene.stop('UIScene');
    }

    // ==========================================
    // PHASER GAME LOGIC
    // ==========================================

    // Color Palette
    const PALETTE = {
        bgTop: 0x050011,
        bgBottom: 0x2a0044,
        grid: 0xff00ff,
        platformFill: 0x0a0a2a,
        platformLine: 0x00ffff,
        player: 0xff00ff,
        playerCore: 0xffffff,
        star: 0xffff00,
        portal: 0x9900ff
    };

    class BootScene extends Phaser.Scene {
        constructor() { super('BootScene'); }

        create() {
            // Generate Textures inline
            const g = this.make.graphics({x: 0, y: 0}, false);

            // 1. Player Orb
            g.clear();
            g.fillStyle(PALETTE.player, 1);
            g.fillCircle(16, 16, 16);
            g.fillStyle(PALETTE.playerCore, 1);
            g.fillCircle(16, 16, 8);
            g.generateTexture('player', 32, 32);

            // 2. Platform (Neon Box)
            g.clear();
            g.fillStyle(PALETTE.platformFill, 0.8);
            g.fillRect(0, 0, 64, 32);
            g.lineStyle(2, PALETTE.platformLine, 1);
            g.strokeRect(1, 1, 62, 30);
            // Top highlight
            g.lineStyle(3, 0xffffff, 0.8);
            g.beginPath(); g.moveTo(2, 2); g.lineTo(62, 2); g.strokePath();
            g.generateTexture('platform', 64, 32);

            // 3. Grid Tile for background
            g.clear();
            g.lineStyle(1, PALETTE.grid, 0.3);
            g.strokeRect(0, 0, 128, 128);
            g.generateTexture('grid', 128, 128);

            // 4. Collectible Star
            g.clear();
            g.fillStyle(PALETTE.star, 1);
            // Draw a diamond shape
            g.beginPath();
            g.moveTo(12, 0); g.lineTo(24, 12); g.lineTo(12, 24); g.lineTo(0, 12);
            g.closePath();
            g.fillPath();
            g.generateTexture('star', 24, 24);

            // 5. Particle
            g.clear();
            g.fillStyle(PALETTE.player, 0.6);
            g.fillCircle(4, 4, 4);
            g.generateTexture('particle', 8, 8);

            // 6. Portal
            g.clear();
            g.lineStyle(4, PALETTE.portal, 1);
            g.strokeCircle(32, 32, 28);
            g.lineStyle(2, 0xffffff, 0.8);
            g.strokeCircle(32, 32, 20);
            g.generateTexture('portal', 64, 64);

            // 7. Mountain silhouette (Parallax)
            g.clear();
            g.fillStyle(0x110022, 1);
            g.beginPath();
            g.moveTo(0, 200); g.lineTo(100, 50); g.lineTo(250, 150); 
            g.lineTo(400, 20); g.lineTo(600, 180); g.lineTo(800, 80);
            g.lineTo(800, 200); g.closePath();
            g.fillPath();
            g.lineStyle(2, 0x330066, 1);
            g.strokePath();
            g.generateTexture('mountain', 800, 200);

            // We don't start the game scene automatically, wait for UI button
        }
    }

    class GameScene extends Phaser.Scene {
        constructor() { super('GameScene'); }

        create() {
            this.levelLength = 4000;
            this.respawnPoint = { x: 100, y: 300 };

            // --- Background & Atmosphere ---
            // Gradient background logic via Graphics (since Phaser doesn't have a simple linear gradient rect)
            let bg = this.add.graphics();
            bg.fillGradientStyle(PALETTE.bgTop, PALETTE.bgTop, PALETTE.bgBottom, PALETTE.bgBottom, 1);
            bg.fillRect(0, 0, this.levelLength + 800, 600);
            bg.setScrollFactor(0); // Lock to camera

            // Parallax Mountains
            this.mountains = this.add.tileSprite(0, 400, 800, 200, 'mountain').setOrigin(0, 1).setScrollFactor(0.2);
            
            // Scrolling Grid Floor (Visual only)
            // We'll place it at the bottom of the screen, moving with camera
            this.gridFloor = this.add.tileSprite(0, 600, 800, 256, 'grid').setOrigin(0, 1).setScrollFactor(0);
            // Apply perspective trick by squishing the top
            this.gridFloor.setPerspective = true; // custom flag
            this.gridFloor.scaleY = 0.5;
            this.gridFloor.alpha = 0.5;

            // --- Level Construction ---
            this.platforms = this.physics.add.staticGroup();
            this.stars = this.physics.add.group({ allowGravity: false });

            // Relaxing Level Design: Wide platforms, small gaps, gently rising/falling
            const levelData = [
                {x: 100, y: 450, w: 5}, {x: 450, y: 450, w: 3}, {x: 750, y: 400, w: 4},
                {x: 1100, y: 450, w: 2}, {x: 1350, y: 350, w: 5}, {x: 1800, y: 300, w: 3},
                {x: 2100, y: 400, w: 4}, {x: 2500, y: 450, w: 6}, {x: 3000, y: 350, w: 3},
                {x: 3300, y: 250, w: 4}, {x: 3700, y: 300, w: 5}
            ];

            levelData.forEach(p => {
                // Create a wide platform by scaling a single segment
                let plat = this.platforms.create(p.x + (p.w * 32), p.y, 'platform');
                plat.setScale(p.w, 1).refreshBody();
                
                // Add Bloom to platforms
                if (plat.postFX) plat.postFX.addBloom(PALETTE.platformLine, 1, 1, 1, GAME_PARAMS.glow_intensity * 0.8);

                // Add some stars above platforms
                if (Phaser.Math.Between(0, 1) > 0) {
                    let star = this.stars.create(p.x + (p.w * 32), p.y - 80, 'star');
                    if (star.postFX) star.postFX.addBloom(PALETTE.star, 1, 1, 1, GAME_PARAMS.glow_intensity);
                    // Gentle float animation
                    this.tweens.add({
                        targets: star,
                        y: star.y - 15,
                        duration: 1500,
                        yoyo: true,
                        repeat: -1,
                        ease: 'Sine.easeInOut'
                    });
                }
            });

            // --- Goal Portal ---
            this.portal = this.physics.add.sprite(3900, 200, 'portal');
            this.portal.body.allowGravity = false;
            if (this.portal.postFX) this.portal.postFX.addBloom(PALETTE.portal, 1, 1, 1, GAME_PARAMS.glow_intensity * 1.5);
            this.tweens.add({
                targets: this.portal,
                angle: 360,
                duration: 3000,
                repeat: -1,
                ease: 'Linear'
            });

            // --- Player ---
            this.player = this.physics.add.sprite(this.respawnPoint.x, this.respawnPoint.y, 'player');
            this.player.setBounce(0.1);
            this.player.setCollideWorldBounds(false); // We handle out of bounds manually for a gentle reset
            this.player.body.setGravityY(GAME_PARAMS.gravity);
            this.player.setMaxVelocity(GAME_PARAMS.player_speed * 1.5, 800);
            this.player.setDragX(500); // Friction

            if (this.player.postFX) this.player.postFX.addBloom(PALETTE.player, 1, 1, 1, GAME_PARAMS.glow_intensity);

            // Player Trail Particles
            this.trail = this.add.particles(0, 0, 'particle', {
                speed: { min: -20, max: 20 },
                angle: { min: 0, max: 360 },
                scale: { start: 1, end: 0 },
                alpha: { start: 0.6, end: 0 },
                blendMode: 'ADD',
                lifespan: 800,
                frequency: 50
            });
            this.trail.startFollow(this.player);

            // --- Collisions ---
            this.physics.add.collider(this.player, this.platforms);
            this.physics.add.overlap(this.player, this.stars, this.collectStar, null, this);
            this.physics.add.overlap(this.player, this.portal, this.reachGoal, null, this);

            // --- Camera ---
            this.cameras.main.setBounds(0, 0, this.levelLength, 600);
            this.cameras.main.startFollow(this.player, true, 0.05, 0.05); // Smooth lerp
            this.cameras.main.setDeadzone(100, 200);

            // --- Input ---
            this.cursors = this.input.keyboard.createCursorKeys();
            this.keys = this.input.keyboard.addKeys('W,A,S,D,SPACE');

            // Fade in gently
            this.cameras.main.fadeIn(1000, 5, 0, 17);
            this.isResetting = false;
        }

        update() {
            if (this.isResetting) return;

            // Parallax updates
            this.mountains.tilePositionX = this.cameras.main.scrollX * 0.2;
            this.gridFloor.tilePositionX = this.cameras.main.scrollX;
            // Animate grid scrolling towards player for pseudo-3D feel
            this.gridFloor.tilePositionY -= 0.5;

            // Movement Logic
            let moving = false;
            let currentSpeed = GAME_PARAMS.player_speed;
            
            // Less control in air for a floaty feel
            if (!this.player.body.touching.down) {
                currentSpeed *= GAME_PARAMS.air_control;
            }

            if (this.cursors.left.isDown || this.keys.A.isDown) {
                this.player.setAccelerationX(-currentSpeed * 5); // Use accel for smooth start/stop
                moving = true;
            } else if (this.cursors.right.isDown || this.keys.D.isDown) {
                this.player.setAccelerationX(currentSpeed * 5);
                moving = true;
            } else {
                this.player.setAccelerationX(0);
            }

            // Jumping (Forgiving: allow slight delay jump)
            if ((this.cursors.up.isDown || this.keys.W.isDown || this.keys.SPACE.isDown) && this.player.body.touching.down) {
                this.player.setVelocityY(GAME_PARAMS.jump_force);
                // Create a little burst effect
                this.createBurst(this.player.x, this.player.y + 16, PALETTE.platformLine);
            }

            // Visual rotation based on velocity
            this.player.rotation += this.player.body.velocity.x * 0.001;

            // Relaxing Failure State (Falling)
            if (this.player.y > 650 && !this.isResetting) {
                this.gentleReset();
            }
        }

        collectStar(player, star) {
            star.disableBody(true, true);
            this.createBurst(star.x, star.y, PALETTE.star);
            
            // Notify UI Scene
            this.scene.get('UIScene').addScore(10);
            
            // Update respawn point to vaguely near where they collected a star
            // to make progress forgiving
            if (star.x > this.respawnPoint.x + 300) {
                this.respawnPoint = { x: star.x - 100, y: 100 }; // respawn high up
            }
        }

        reachGoal(player, portal) {
            this.isResetting = true;
            this.player.body.stop();
            this.player.body.allowGravity = false;
            
            // Suck into portal animation
            this.tweens.add({
                targets: this.player,
                x: portal.x,
                y: portal.y,
                scale: 0,
                duration: 1000,
                ease: 'Power2',
                onComplete: () => {
                    showWinScreen();
                }
            });
        }

        gentleReset() {
            this.isResetting = true;
            this.player.body.stop();
            this.player.body.allowGravity = false;
            
            // Fade to background color
            this.cameras.main.fadeOut(800, 5, 0, 17);
            
            this.cameras.main.once('camerafadeoutcomplete', () => {
                // Reset position
                this.player.setPosition(this.respawnPoint.x, this.respawnPoint.y);
                this.player.setVelocity(0, 0);
                this.player.setAcceleration(0, 0);
                this.player.body.allowGravity = true;
                
                // Fade back in
                this.cameras.main.fadeIn(800, 5, 0, 17);
                this.time.delayedCall(800, () => {
                    this.isResetting = false;
                });
            });
        }

        createBurst(x, y, color) {
            let burst = this.add.particles(x, y, 'particle', {
                speed: { min: 50, max: 150 },
                angle: { min: 0, max: 360 },
                scale: { start: 1, end: 0 },
                alpha: { start: 1, end: 0 },
                tint: color,
                blendMode: 'ADD',
                lifespan: 600,
                quantity: 10,
                emitting: false
            });
            burst.explode();
            // Cleanup after explosion
            this.time.delayedCall(1000, () => { burst.destroy(); });
        }
    }

    class UIScene extends Phaser.Scene {
        constructor() { super({ key: 'UIScene', active: false }); }

        create() {
            this.score = 0;
            this.scoreText = this.add.text(20, 20, 'VIBE: 0', {
                fontFamily: 'Segoe UI, sans-serif',
                fontSize: '24px',
                color: '#00ffff',
                fontStyle: 'bold'
            });
            this.scoreText.setShadow(0, 0, '#ff00ff', 10, false, true);
        }

        addScore(points) {
            this.score += points;
            this.scoreText.setText('VIBE: ' + this.score);
            
            // Little pop animation
            this.tweens.add({
                targets: this.scoreText,
                scale: 1.2,
                duration: 100,
                yoyo: true
            });
        }

        resetScore() {
            this.score = 0;
            if (this.scoreText) this.scoreText.setText('VIBE: 0');
        }
    }

    // ==========================================
    // INITIALIZATION
    // ==========================================
    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: 800,
        height: 600,
        backgroundColor: '#050011',
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 0 }, // Handled dynamically in GameScene
                debug: false
            }
        },
        scene: [BootScene, GameScene, UIScene]
    };

    window.gameInstance = new Phaser.Game(config);

</script>
</body>
</html>
