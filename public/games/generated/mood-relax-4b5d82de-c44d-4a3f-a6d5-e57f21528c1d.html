<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Koi Pond - Relax</title>
    <meta name="game-icon" content="🎏">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="/games/lib/skillprint-adjustment.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #a8dadc;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            color: #1d3557;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .score-box {
            background: rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            font-size: 1.2rem;
            font-weight: bold;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(241, 250, 238, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #457b9d;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            pointer-events: auto;
        }
        .btn:hover {
            background-color: #1d3557;
            transform: scale(1.05);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #1d3557;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #457b9d;
        }
        canvas {
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }
    </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="/games/lib/skillprint-adjustment.js"></script>
</head>
<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-box" id="score-display">Petals Collected: 0</div>
            <div class="score-box" id="garden-display">Garden: Level 1</div>
        </div>
    </div>

    <div id="start-screen">
        <h1>Zen Koi Pond</h1>
        <p>Guide the koi gently to collect floating petals.</p>
        <button class="btn" onclick="startGame()">Begin Journey</button>
    </div>

    <script>
        // Global Game Configuration for Adjustability
        window.GAME_SETTINGS = {
            koi_speed: 120,
            petal_spawn_rate: 2500,
            petal_drift_speed: 30,
            ripple_intensity: 0.5,
            koi_size: 0.6,
            background_tint: 0xa8dadc,
            petal_scale: 1.0,
            rotation_speed: 0.05
        };

        // Skillprint Adjustment Registration
        if (window.Skillprint) {
            window.Skillprint.registerAdjustments({
                '1': { parameterName: 'koi_speed', description: 'Slower Swimming', value: 80 },
                '2': { parameterName: 'koi_speed', description: 'Faster Swimming', value: 200 },
                '3': { parameterName: 'petal_spawn_rate', description: 'Fewer Petals', value: 5000 },
                '4': { parameterName: 'petal_spawn_rate', description: 'More Petals', value: 1000 },
                '5': { parameterName: 'petal_drift_speed', description: 'Still Water', value: 10 },
                '6': { parameterName: 'petal_drift_speed', description: 'Flowing Water', value: 60 },
                '7': { parameterName: 'ripple_intensity', description: 'Soft Ripples', value: 0.2 },
                '8': { parameterName: 'ripple_intensity', description: 'Strong Ripples', value: 1.0 },
                '9': { parameterName: 'koi_size', description: 'Smaller Koi', value: 0.4 }
            });
        }

        // Adjustment Function
        window.adjustGame = function(obj) {
            if (typeof obj === 'object' && obj.hasOwnProperty('parameterName')) {
                window.GAME_SETTINGS[obj.parameterName] = obj.parameterValue;
                
                // Real-time updates for specific properties
                const scene = game.scene.getScene('MainScene');
                if (scene && scene.koi) {
                    if (obj.parameterName === 'koi_size') scene.koi.setScale(obj.parameterValue);
                    if (obj.parameterName === 'petal_spawn_rate') {
                        scene.spawnTimer.remove();
                        scene.spawnTimer = scene.time.addEvent({
                            delay: window.GAME_SETTINGS.petal_spawn_rate,
                            callback: scene.spawnPetal,
                            callbackScope: scene,
                            loop: true
                        });
                    }
                }
            }
        };

        function startGame() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                game.scene.resume('MainScene');
            }, 500);
        }

        class MainScene extends Phaser.Scene {
            constructor() {
                super('MainScene');
                this.score = 0;
                this.gardenLevel = 1;
            }

            preload() {
                // Generate procedural textures
                // Koi Fish SVG
                const koiSvg = `
                <svg width="100" height="40" viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 20 C20 0, 80 0, 100 20 C80 40, 20 40, 0 20" fill="#f1faee" />
                    <path d="M10 20 C20 10, 40 10, 50 20 C40 30, 20 30, 10 20" fill="#e63946" opacity="0.6"/>
                    <circle cx="85" cy="15" r="2" fill="#1d3557" />
                    <circle cx="85" cy="25" r="2" fill="#1d3557" />
                </svg>`;
                const koiUrl = 'data:image/svg+xml;base64,' + btoa(koiSvg);
                this.load.image('koi', koiUrl);

                // Petal SVG
                const petalSvg = `
                <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 0 C15 5, 15 15, 10 20 C5 15, 5 5, 10 0" fill="#ffb703" />
                </svg>`;
                const petalUrl = 'data:image/svg+xml;base64,' + btoa(petalSvg);
                this.load.image('petal', petalUrl);

                // Ripple circle
                let graphics = this.make.graphics({ x: 0, y: 0, add: false });
                graphics.lineStyle(2, 0xffffff, 1);
                graphics.strokeCircle(32, 32, 30);
                graphics.generateTexture('ripple', 64, 64);
            }

            create() {
                this.cameras.main.setBackgroundColor(window.GAME_SETTINGS.background_tint);
                
                // Groups
                this.ripples = this.add.group();
                this.petals = this.physics.add.group();
                this.flowers = this.add.group();

                // Particle Emitter for water sparkles
                const particles = this.add.particles(0, 0, 'ripple', {
                    scale: { start: 0.1, end: 0 },
                    alpha: { start: 0.3, end: 0 },
                    speed: 20,
                    lifespan: 2000,
                    blendMode: 'ADD',
                    frequency: 150,
                    emitZone: { source: new Phaser.Geom.Rectangle(0, 0, 1200, 800) }
                });

                // Koi Player
                this.koi = this.physics.add.sprite(400, 300, 'koi');
                this.koi.setScale(window.GAME_SETTINGS.koi_size);
                this.koi.setDepth(10);
                this.koi.setCollideWorldBounds(true);

                // Input for movement
                this.input.on('pointermove', (pointer) => {
                    this.createRipple(pointer.x, pointer.y);
                });

                // Petal Spawner
                this.spawnTimer = this.time.addEvent({
                    delay: window.GAME_SETTINGS.petal_spawn_rate,
                    callback: this.spawnPetal,
                    callbackScope: this,
                    loop: true
                });

                // Collisions
                this.physics.add.overlap(this.koi, this.petals, this.collectPetal, null, this);

                // Initial State
                this.scene.pause();
            }

            update() {
                const pointer = this.input.activePointer;
                
                // Gentle movement towards pointer
                const angle = Phaser.Math.Angle.Between(this.koi.x, this.koi.y, pointer.x, pointer.y);
                
                // Smooth rotation
                this.koi.rotation = Phaser.Math.Angle.RotateTo(this.koi.rotation, angle, window.GAME_SETTINGS.rotation_speed);

                // Move forward in the direction of rotation
                const dist = Phaser.Math.Distance.Between(this.koi.x, this.koi.y, pointer.x, pointer.y);
                if (dist > 20) {
                    this.physics.velocityFromRotation(this.koi.rotation, window.GAME_SETTINGS.koi_speed, this.koi.body.velocity);
                } else {
                    this.koi.body.setVelocity(this.koi.body.velocity.x * 0.95, this.koi.body.velocity.y * 0.95);
                }

                // Clean up ripples
                this.ripples.getChildren().forEach(ripple => {
                    ripple.setScale(ripple.scale + 0.02);
                    ripple.alpha -= 0.01;
                    if (ripple.alpha <= 0) ripple.destroy();
                });

                // Petal drifting
                this.petals.getChildren().forEach(petal => {
                    petal.angle += 0.5;
                });
            }

            createRipple(x, y) {
                if (Phaser.Math.Between(0, 10) > 8) {
                    const ripple = this.add.image(x, y, 'ripple');
                    ripple.setScale(0.1);
                    ripple.setAlpha(window.GAME_SETTINGS.ripple_intensity);
                    this.ripples.add(ripple);
                }
            }

            spawnPetal() {
                const x = Phaser.Math.Between(50, this.sys.game.config.width - 50);
                const y = Phaser.Math.Between(50, this.sys.game.config.height - 50);
                
                const petal = this.petals.create(x, y, 'petal');
                petal.setScale(0);
                petal.setAlpha(0);
                petal.setTint(Phaser.Utils.Array.GetRandom([0xffadad, 0xffd6a5, 0xfdffb6, 0xcaffbf, 0x9bf6ff]));
                
                this.tweens.add({
                    targets: petal,
                    scale: window.GAME_SETTINGS.petal_scale,
                    alpha: 0.8,
                    duration: 1000
                });

                // Gentle drift
                const vx = Phaser.Math.Between(-window.GAME_SETTINGS.petal_drift_speed, window.GAME_SETTINGS.petal_drift_speed);
                const vy = Phaser.Math.Between(-window.GAME_SETTINGS.petal_drift_speed, window.GAME_SETTINGS.petal_drift_speed);
                petal.setVelocity(vx, vy);
                petal.setCollideWorldBounds(true, 1, 1);
            }

            collectPetal(koi, petal) {
                // Visual feedback
                const fx = this.add.circle(petal.x, petal.y, 10, 0xffffff, 0.8);
                this.tweens.add({
                    targets: fx,
                    scale: 3,
                    alpha: 0,
                    duration: 500,
                    onComplete: () => fx.destroy()
                });

                petal.destroy();
                this.score++;
                document.getElementById('score-display').innerText = `Petals Collected: ${this.score}`;

                if (this.score % 10 === 0) {
                    this.levelUpGarden();
                }
            }

            levelUpGarden() {
                this.gardenLevel++;
                document.getElementById('garden-display').innerText = `Garden: Level ${this.gardenLevel}`;
                
                // Add a permanent "flower" to the edge of the pond
                const side = Phaser.Math.Between(0, 3);
                let x, y;
                if (side === 0) { x = Phaser.Math.Between(0, 800); y = 20; }
                else if (side === 1) { x = 780; y = Phaser.Math.Between(0, 600); }
                else if (side === 2) { x = Phaser.Math.Between(0, 800); y = 580; }
                else { x = 20; y = Phaser.Math.Between(0, 600); }

                const flower = this.add.star(x, y, 5, 5, 12, 0xffc6ff);
                flower.setAlpha(0);
                this.tweens.add({
                    targets: flower,
                    alpha: 0.6,
                    scale: 1.5,
                    duration: 2000,
                    ease: 'Back.easeOut'
                });
                this.flowers.add(flower);
            }
        }

        const config = {
            type: Phaser.AUTO,
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#a8dadc',
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: MainScene
        };

        const game = new Phaser.Game(config);

        window.addEventListener('resize', () => {
            game.scale.resize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
