<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Memory</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 16px;
            overflow: hidden;
        }
    </style>
    <!-- Phaser 3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
    <!-- Skillprint Adjustment Library Mock (for standalone testing, will be overwritten by actual library if present) -->
    <script>
        if (!window.Skillprint) {
            window.Skillprint = {
                registerAdjustments: function(mappings) {
                    window.addEventListener('keydown', function(event) {
                        if (mappings[event.key] && typeof window.adjustGame === 'function') {
                            window.adjustGame({
                                parameterName: mappings[event.key].parameterName,
                                parameterValue: mappings[event.key].value
                            });
                        }
                    });
                }
            };
        }
    </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="/games/lib/skillprint-adjustment.js"></script>
</head>
<body>

<div id="game-container"></div>

<script>
    // --- Global Configuration & Adjustability ---
    window.GAME_CONFIG = {
        cols: 4,
        rows: 3,
        periods: 3, // Number of time periods (dimensions)
        peekDuration: 1000, // Ms cards stay visible on mismatch
        colors: {
            past: { bg: 0xFFE5D9, card: 0xFFCAD4, accent: 0xF4A261, text: 0x9D5C30, name: 'PAST' },
            present: { bg: 0xD8E2DC, card: 0xB5C9C3, accent: 0x2A9D8F, text: 0x1A635A, name: 'PRESENT' },
            future: { bg: 0xCDB4DB, card: 0xB19CD9, accent: 0x9D4EDD, text: 0x5D2D8A, name: 'FUTURE' },
            symbol: 0x2D3748,
            cardFront: 0xFFFFFF
        }
    };

    window.adjustGame = function(obj) {
        if (!obj || !obj.parameterName) return;
        const { parameterName, parameterValue } = obj;
        let requiresRestart = false;

        if (parameterName === 'peek_duration') {
            window.GAME_CONFIG.peekDuration = parameterValue;
        } else if (parameterName === 'periods') {
            if (window.GAME_CONFIG.periods !== parameterValue) {
                window.GAME_CONFIG.periods = parameterValue;
                requiresRestart = true;
            }
        } else if (parameterName === 'grid_size') {
            if (parameterValue === 12) { window.GAME_CONFIG.cols = 4; window.GAME_CONFIG.rows = 3; }
            if (parameterValue === 16) { window.GAME_CONFIG.cols = 4; window.GAME_CONFIG.rows = 4; }
            requiresRestart = true;
        }

        console.log(`Adjusted ${parameterName} to ${parameterValue}`);

        if (requiresRestart && window.gameInstance) {
            const gameScene = window.gameInstance.scene.getScene('GameScene');
            if (gameScene && gameScene.scene.isActive()) {
                gameScene.scene.restart();
            }
        }
    };

    window.Skillprint.registerAdjustments({
        '1': { parameterName: 'peek_duration', description: 'Fast Peek (500ms)', value: 500 },
        '2': { parameterName: 'peek_duration', description: 'Slow Peek (1500ms)', value: 1500 },
        '3': { parameterName: 'periods', description: '2 Time Periods', value: 2 },
        '4': { parameterName: 'periods', description: '3 Time Periods', value: 3 },
        '5': { parameterName: 'grid_size', description: '4x3 Grid', value: 12 },
        '6': { parameterName: 'grid_size', description: '4x4 Grid', value: 16 }
    });

    // --- Helper Functions ---
    function getPeriodData(index) {
        const keys = ['past', 'present', 'future'];
        return window.GAME_CONFIG.colors[keys[index % keys.length]];
    }

    function drawSymbol(graphics, id, size) {
        graphics.clear();
        graphics.lineStyle(4, window.GAME_CONFIG.colors.symbol, 1);
        graphics.fillStyle(window.GAME_CONFIG.colors.symbol, 1);
        const s = size / 2;

        switch(id) {
            case 0: graphics.strokeCircle(0, 0, s); break;
            case 1: graphics.strokeRect(-s, -s, size, size); break;
            case 2: graphics.strokeTriangle(0, -s, s, s, -s, s); break;
            case 3: graphics.beginPath(); graphics.moveTo(0, -s); graphics.lineTo(s, 0); graphics.lineTo(0, s); graphics.lineTo(-s, 0); graphics.closePath(); graphics.strokePath(); break;
            case 4: graphics.moveTo(-s, -s); graphics.lineTo(s, s); graphics.moveTo(s, -s); graphics.lineTo(-s, s); graphics.strokePath(); break;
            case 5: graphics.moveTo(0, -s); graphics.lineTo(0, s); graphics.moveTo(-s, 0); graphics.lineTo(s, 0); graphics.strokePath(); break;
            case 6: graphics.fillCircle(0, 0, s*0.8); break;
            case 7: graphics.fillRect(-s*0.8, -s*0.8, size*0.8, size*0.8); break;
            case 8: graphics.beginPath(); for (let i=0; i<6; i++) { let a = (i * 60) * Math.PI / 180; graphics[i===0?'moveTo':'lineTo'](Math.cos(a)*s, Math.sin(a)*s); } graphics.closePath(); graphics.strokePath(); break;
            case 9: graphics.moveTo(-s, -s/2); graphics.lineTo(s, -s/2); graphics.moveTo(-s, s/2); graphics.lineTo(s, s/2); graphics.strokePath(); break;
            case 10: graphics.moveTo(-s/2, -s); graphics.lineTo(-s/2, s); graphics.moveTo(s/2, -s); graphics.lineTo(s/2, s); graphics.strokePath(); break;
            case 11: graphics.strokeTriangle(0, s, s, -s, -s, -s); break;
            case 12: graphics.strokeCircle(0,0,s); graphics.strokeCircle(0,0,s/2); break;
            case 13: graphics.strokeRect(-s,-s,size,size); graphics.strokeRect(-s/2,-s/2,s,s); break;
            case 14: graphics.moveTo(0,-s); graphics.lineTo(s,0); graphics.moveTo(0,-s); graphics.lineTo(-s,0); graphics.moveTo(0,-s); graphics.lineTo(0,s); graphics.strokePath(); break;
            case 15: graphics.fillCircle(-s*0.6, 0, s*0.2); graphics.fillCircle(0, 0, s*0.2); graphics.fillCircle(s*0.6, 0, s*0.2); break;
            case 16: graphics.moveTo(-s,-s); graphics.lineTo(s,-s); graphics.lineTo(-s,s); graphics.lineTo(s,s); graphics.closePath(); graphics.strokePath(); break;
            case 17: graphics.moveTo(-s,-s); graphics.lineTo(-s,s); graphics.lineTo(s,-s); graphics.lineTo(s,s); graphics.closePath(); graphics.strokePath(); break;
            case 18: graphics.strokeCircle(0,0,s); graphics.moveTo(0,-s); graphics.lineTo(0,s); graphics.moveTo(-s,0); graphics.lineTo(s,0); graphics.strokePath(); break;
            case 19: graphics.moveTo(-s/2,-s); graphics.lineTo(-s/2,s); graphics.moveTo(s/2,-s); graphics.lineTo(s/2,s); graphics.moveTo(-s,-s/2); graphics.lineTo(s,-s/2); graphics.moveTo(-s,s/2); graphics.lineTo(s,s/2); graphics.strokePath(); break;
            case 20: graphics.strokeCircle(0,0,s); graphics.fillCircle(0,0,s/3); break;
            case 21: graphics.moveTo(-s,-s); graphics.lineTo(0,0); graphics.lineTo(s,-s); graphics.lineTo(s,s); graphics.strokePath(); break;
            case 22: graphics.beginPath(); graphics.moveTo(0, -s); graphics.lineTo(s, 0); graphics.lineTo(0, s); graphics.lineTo(-s, 0); graphics.closePath(); graphics.fillPath(); break;
            case 23: graphics.fillTriangle(0, -s, s, s, -s, s); break;
            default: graphics.strokeCircle(0,0,s);
        }
    }

    // --- Game Objects ---
    class Card extends Phaser.GameObjects.Container {
        constructor(scene, x, y, width, height, period, symbolId) {
            super(scene, x, y);
            this.period = period;
            this.symbolId = symbolId;
            this.isFlipped = false;
            this.isMatched = false;
            this.cardWidth = width;
            this.cardHeight = height;

            const pData = getPeriodData(period);

            // Back of card
            this.bgDown = scene.add.graphics();
            this.bgDown.fillStyle(pData.card, 1);
            this.bgDown.fillRoundedRect(-width/2, -height/2, width, height, 12);
            
            // Front of card
            this.bgUp = scene.add.graphics();
            this.bgUp.fillStyle(window.GAME_CONFIG.colors.cardFront, 1);
            this.bgUp.fillRoundedRect(-width/2, -height/2, width, height, 12);
            // Border matching origin period
            this.bgUp.lineStyle(4, pData.accent, 1);
            this.bgUp.strokeRoundedRect(-width/2 + 2, -height/2 + 2, width - 4, height - 4, 10);

            // Symbol
            this.symbol = scene.add.graphics();
            drawSymbol(this.symbol, symbolId, Math.min(width, height) * 0.5);

            this.bgUp.setVisible(false);
            this.symbol.setVisible(false);

            this.add([this.bgDown, this.bgUp, this.symbol]);
            this.setSize(width, height);
            this.setInteractive({ useHandCursor: true });
            
            this.on('pointerdown', () => {
                scene.handleCardClick(this);
            });
            
            // Hover effect
            this.on('pointerover', () => { if(!this.isFlipped && !this.isMatched) this.scene.tweens.add({targets:this, scale:1.05, duration:100}); });
            this.on('pointerout', () => { if(!this.isFlipped && !this.isMatched) this.scene.tweens.add({targets:this, scale:1, duration:100}); });
        }

        flipUp() {
            this.isFlipped = true;
            this.scene.tweens.add({
                targets: this,
                scaleX: 0,
                duration: 150,
                onComplete: () => {
                    this.bgDown.setVisible(false);
                    this.bgUp.setVisible(true);
                    this.symbol.setVisible(true);
                    this.scene.tweens.add({ targets: this, scaleX: 1, duration: 150 });
                }
            });
        }

        flipDown() {
            this.isFlipped = false;
            this.scene.tweens.add({
                targets: this,
                scaleX: 0,
                duration: 150,
                onComplete: () => {
                    this.bgUp.setVisible(false);
                    this.symbol.setVisible(false);
                    this.bgDown.setVisible(true);
                    this.scene.tweens.add({ targets: this, scaleX: 1, duration: 150 });
                }
            });
        }

        setMatched() {
            this.isMatched = true;
            this.scene.tweens.add({
                targets: this,
                scale: 0.8,
                alpha: 0.5,
                duration: 300
            });
            this.disableInteractive();
        }
    }

    // --- Scenes ---
    class BootScene extends Phaser.Scene {
        constructor() { super('BootScene'); }
        create() { this.scene.start('MenuScene'); }
    }

    class MenuScene extends Phaser.Scene {
        constructor() { super('MenuScene'); }
        create() {
            const cx = this.cameras.main.centerX;
            const cy = this.cameras.main.centerY;
            
            this.cameras.main.setBackgroundColor(0x1a1a2e);

            // Title
            this.add.text(cx, cy - 100, '4D MEMORY', {
                fontFamily: 'Inter', fontSize: '64px', fontWeight: '900', color: '#ffffff', letterSpacing: '4px'
            }).setOrigin(0.5);
            
            this.add.text(cx, cy - 30, 'Matches transcend time.', {
                fontFamily: 'Inter', fontSize: '20px', color: '#a0a0b0'
            }).setOrigin(0.5);

            // Play Button
            const btn = this.add.graphics();
            btn.fillStyle(0x64FFDA, 1);
            btn.fillRoundedRect(-100, -30, 200, 60, 30);
            
            const btnText = this.add.text(0, 0, 'START', {
                fontFamily: 'Inter', fontSize: '24px', fontWeight: 'bold', color: '#1a1a2e'
            }).setOrigin(0.5);

            const btnContainer = this.add.container(cx, cy + 80, [btn, btnText]);
            btnContainer.setSize(200, 60);
            btnContainer.setInteractive({ useHandCursor: true });
            
            btnContainer.on('pointerover', () => this.tweens.add({targets:btnContainer, scale:1.1, duration:100}));
            btnContainer.on('pointerout', () => this.tweens.add({targets:btnContainer, scale:1, duration:100}));
            btnContainer.on('pointerdown', () => this.scene.start('GameScene'));
        }
    }

    class GameScene extends Phaser.Scene {
        constructor() { super('GameScene'); }

        create() {
            this.cfg = window.GAME_CONFIG;
            this.currentPeriod = 0;
            this.cards = [];
            this.selectedCards = [];
            this.matchesFound = 0;
            this.moves = 0;
            this.isProcessing = false;
            
            this.totalPairs = (this.cfg.cols * this.cfg.rows * this.cfg.periods) / 2;

            // Setup Camera
            this.cameras.main.setBackgroundColor(getPeriodData(this.currentPeriod).bg);

            this.createUI();
            this.createDeck();
            this.createTimeSelector();
            
            this.switchPeriod(0, true);
        }

        createUI() {
            const w = this.scale.width;
            
            // Top Bar Background
            const topBar = this.add.graphics();
            topBar.fillStyle(0xffffff, 0.2);
            topBar.fillRect(0, 0, w, 80);

            // Score/Moves
            this.scoreText = this.add.text(30, 40, 'PAIRS: 0 / ' + this.totalPairs, {
                fontFamily: 'Inter', fontSize: '20px', fontWeight: 'bold', color: '#333'
            }).setOrigin(0, 0.5);
            
            this.movesText = this.add.text(200, 40, 'MOVES: 0', {
                fontFamily: 'Inter', fontSize: '20px', fontWeight: 'bold', color: '#333'
            }).setOrigin(0, 0.5);

            // Selected Buffer UI
            this.add.text(w - 220, 40, 'BUFFER:', {
                fontFamily: 'Inter', fontSize: '16px', fontWeight: 'bold', color: '#333'
            }).setOrigin(1, 0.5);

            this.bufferSlots = [];
            for(let i=0; i<2; i++) {
                const bx = w - 160 + (i * 70);
                const by = 40;
                
                // Empty slot bg
                const slotBg = this.add.graphics();
                slotBg.fillStyle(0xffffff, 0.5);
                slotBg.fillRoundedRect(bx - 25, by - 25, 50, 50, 8);
                
                // Container for filled state
                const slotContent = this.add.container(bx, by);
                this.bufferSlots.push({ bg: slotBg, content: slotContent });
            }
        }

        updateBufferUI() {
            // Clear contents
            this.bufferSlots.forEach(slot => slot.content.removeAll(true));

            // Draw selected cards in buffer
            this.selectedCards.forEach((card, index) => {
                if(index >= 2) return;
                const slot = this.bufferSlots[index].content;
                const pData = getPeriodData(card.period);
                
                const bg = this.add.graphics();
                bg.fillStyle(0xffffff, 1);
                bg.fillRoundedRect(-25, -25, 50, 50, 8);
                bg.lineStyle(3, pData.accent, 1);
                bg.strokeRoundedRect(-25, -25, 50, 50, 8);
                
                const sym = this.add.graphics();
                drawSymbol(sym, card.symbolId, 25);
                
                slot.add([bg, sym]);
                
                // Pop animation
                slot.setScale(0);
                this.tweens.add({ targets: slot, scale: 1, duration: 200, ease: 'Back.out' });
            });
        }

        createDeck() {
            const totalCards = this.cfg.cols * this.cfg.rows * this.cfg.periods;
            let pairIds = [];
            for (let i = 0; i < totalCards / 2; i++) {
                pairIds.push(i);
                pairIds.push(i);
            }
            
            // Shuffle
            for (let i = pairIds.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pairIds[i], pairIds[j]] = [pairIds[j], pairIds[i]];
            }

            // Layout math
            const gridW = this.scale.width;
            const gridH = this.scale.height - 80 - 120; // top bar, bottom bar
            const startY = 80;
            
            const padding = 15;
            const cellW = (gridW - padding * (this.cfg.cols + 1)) / this.cfg.cols;
            const cellH = (gridH - padding * (this.cfg.rows + 1)) / this.cfg.rows;
            
            // Limit card size to remain square-ish and not too huge
            const cardSize = Math.min(cellW, cellH, 120);
            
            const offsetX = (gridW - (this.cfg.cols * cardSize + (this.cfg.cols - 1) * padding)) / 2;
            const offsetY = startY + (gridH - (this.cfg.rows * cardSize + (this.cfg.rows - 1) * padding)) / 2;

            let idIndex = 0;
            for (let p = 0; p < this.cfg.periods; p++) {
                for (let r = 0; r < this.cfg.rows; r++) {
                    for (let c = 0; c < this.cfg.cols; c++) {
                        const x = offsetX + c * (cardSize + padding) + cardSize/2;
                        const y = offsetY + r * (cardSize + padding) + cardSize/2;
                        
                        const card = new Card(this, x, y, cardSize, cardSize, p, pairIds[idIndex]);
                        this.add.existing(card);
                        card.setVisible(false);
                        this.cards.push(card);
                        idIndex++;
                    }
                }
            }
        }

        createTimeSelector() {
            const w = this.scale.width;
            const h = this.scale.height;
            const barH = 100;
            const startY = h - barH;

            // Background
            const bg = this.add.graphics();
            bg.fillStyle(0xffffff, 0.1);
            bg.fillRect(0, startY, w, barH);

            this.periodButtons = [];
            const btnW = 160;
            const btnH = 50;
            const spacing = 20;
            const totalW = (btnW * this.cfg.periods) + (spacing * (this.cfg.periods - 1));
            const startX = (w - totalW) / 2;

            for (let i = 0; i < this.cfg.periods; i++) {
                const pData = getPeriodData(i);
                const bx = startX + i * (btnW + spacing) + btnW/2;
                const by = startY + barH/2;

                const btnBg = this.add.graphics();
                // Base style
                btnBg.fillStyle(0xffffff, 0.8);
                btnBg.fillRoundedRect(-btnW/2, -btnH/2, btnW, btnH, 25);
                
                const text = this.add.text(0, 0, pData.name, {
                    fontFamily: 'Inter', fontSize: '18px', fontWeight: 'bold', color: '#333'
                }).setOrigin(0.5);

                const container = this.add.container(bx, by, [btnBg, text]);
                container.setSize(btnW, btnH);
                container.setInteractive({ useHandCursor: true });
                
                container.on('pointerdown', () => this.switchPeriod(i));
                
                this.periodButtons.push({ container, bg: btnBg, text: text, index: i });
            }
        }

        updateTimeSelectorUI() {
            this.periodButtons.forEach(btn => {
                const pData = getPeriodData(btn.index);
                btn.bg.clear();
                if (btn.index === this.currentPeriod) {
                    btn.bg.fillStyle(pData.accent, 1);
                    btn.bg.fillRoundedRect(-80, -25, 160, 50, 25);
                    btn.text.setColor('#ffffff');
                    btn.container.setScale(1.1);
                } else {
                    btn.bg.fillStyle(0xffffff, 0.6);
                    btn.bg.fillRoundedRect(-80, -25, 160, 50, 25);
                    btn.text.setColor('#333333');
                    btn.container.setScale(1.0);
                }
            });
        }

        switchPeriod(newPeriod, initial = false) {
            if (!initial && this.currentPeriod === newPeriod) return;
            
            const oldPeriod = this.currentPeriod;
            this.currentPeriod = newPeriod;
            const pData = getPeriodData(newPeriod);

            // Update UI
            this.updateTimeSelectorUI();

            // Transition Background
            this.tweens.addCounter({
                from: 0, to: 100, duration: 500,
                onUpdate: (tween) => {
                    const c1 = Phaser.Display.Color.IntegerToColor(getPeriodData(oldPeriod).bg);
                    const c2 = Phaser.Display.Color.IntegerToColor(pData.bg);
                    const color = Phaser.Display.Color.Interpolate.ColorWithColor(c1, c2, 100, tween.getValue());
                    this.cameras.main.setBackgroundColor(Phaser.Display.Color.GetColor(color.r, color.g, color.b));
                    
                    // Update text colors for contrast
                    this.scoreText.setColor(pData.text === 0xFFFFFF ? '#fff' : '#' + pData.text.toString(16).padStart(6,'0'));
                    this.movesText.setColor(pData.text === 0xFFFFFF ? '#fff' : '#' + pData.text.toString(16).padStart(6,'0'));
                }
            });

            // Transition Cards
            this.cards.forEach(card => {
                if (card.period === newPeriod) {
                    if (!card.visible) {
                        card.setVisible(true);
                        card.setScale(0);
                        card.setAlpha(0);
                        this.tweens.add({ targets: card, scale: card.isMatched ? 0.8 : 1, alpha: card.isMatched ? 0.5 : 1, duration: 400, ease: 'Back.out' });
                    }
                } else {
                    if (card.visible) {
                        this.tweens.add({
                            targets: card, scale: 0, alpha: 0, duration: 300,
                            onComplete: () => card.setVisible(false)
                        });
                    }
                }
            });
        }

        handleCardClick(card) {
            if (this.isProcessing || card.isFlipped || card.isMatched || this.selectedCards.length >= 2) return;

            card.flipUp();
            this.selectedCards.push(card);
            this.updateBufferUI();

            if (this.selectedCards.length === 2) {
                this.isProcessing = true;
                this.moves++;
                this.movesText.setText('MOVES: ' + this.moves);

                const c1 = this.selectedCards[0];
                const c2 = this.selectedCards[1];

                if (c1.symbolId === c2.symbolId) {
                    // Match
                    this.time.delayedCall(500, () => {
                        c1.setMatched();
                        c2.setMatched();
                        this.matchesFound++;
                        this.scoreText.setText(`PAIRS: ${this.matchesFound} / ${this.totalPairs}`);
                        this.selectedCards = [];
                        this.updateBufferUI();
                        this.isProcessing = false;
                        
                        if (this.matchesFound === this.totalPairs) {
                            this.time.delayedCall(500, () => this.scene.start('GameOverScene', { moves: this.moves }));
                        }
                    });
                } else {
                    // Mismatch
                    this.time.delayedCall(this.cfg.peekDuration, () => {
                        c1.flipDown();
                        c2.flipDown();
                        this.selectedCards = [];
                        this.updateBufferUI();
                        this.isProcessing = false;
                    });
                }
            }
        }
    }

    class GameOverScene extends Phaser.Scene {
        constructor() { super('GameOverScene'); }
        
        init(data) { this.moves = data.moves; }

        create() {
            const cx = this.cameras.main.centerX;
            const cy = this.cameras.main.centerY;
            
            this.cameras.main.setBackgroundColor(0x1a1a2e);

            this.add.text(cx, cy - 80, 'DIMENSIONS ALIGNED', {
                fontFamily: 'Inter', fontSize: '48px', fontWeight: '900', color: '#64FFDA'
            }).setOrigin(0.5);
            
            this.add.text(cx, cy, `Completed in ${this.moves} moves`, {
                fontFamily: 'Inter', fontSize: '24px', color: '#ffffff'
            }).setOrigin(0.5);

            // Play Again Button
            const btn = this.add.graphics();
            btn.fillStyle(0xffffff, 1);
            btn.fillRoundedRect(-100, -25, 200, 50, 25);
            
            const btnText = this.add.text(0, 0, 'PLAY AGAIN', {
                fontFamily: 'Inter', fontSize: '20px', fontWeight: 'bold', color: '#1a1a2e'
            }).setOrigin(0.5);

            const btnContainer = this.add.container(cx, cy + 80, [btn, btnText]);
            btnContainer.setSize(200, 50);
            btnContainer.setInteractive({ useHandCursor: true });
            
            btnContainer.on('pointerover', () => this.tweens.add({targets:btnContainer, scale:1.1, duration:100}));
            btnContainer.on('pointerout', () => this.tweens.add({targets:btnContainer, scale:1, duration:100}));
            btnContainer.on('pointerdown', () => this.scene.start('GameScene'));
        }
    }

    // --- Phaser Initialization ---
    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: 800,
        height: 700,
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        scene: [BootScene, MenuScene, GameScene, GameOverScene]
    };

    window.gameInstance = new Phaser.Game(config);

</script>
</body>
</html>
