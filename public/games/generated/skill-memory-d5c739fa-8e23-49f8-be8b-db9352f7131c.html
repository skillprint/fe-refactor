<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .board { display: grid; grid-template-columns: repeat(4, 50px); gap: 10px; }
        .card { width: 50px; height: 50px; background-color: #ccc; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .hidden { visibility: hidden; }
    </style>
</head>
<body>
    <div class="board" id="gameBoard"></div>

    <script>
        const boardSize = 16;
        const symbols = ['😊', '😢', '😍', '🤔', '😠', '😔', '😡', '😎'];
        let flippedCards = [];
        let matchedPairs = [];

        function createBoard() {
            const gameBoard = document.getElementById('gameBoard');
            const cards = [...symbols, ...symbols].sort(() => Math.random() - 0.5);
            
            cards.forEach((symbol, index) => {
                const card = document.createElement('div');
                card.classList.add('card', 'hidden');
                card.dataset.index = index;
                card.textContent = symbol;
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (flippedCards.length === 2 || this.classList.contains('matched') || flippedCards.includes(this)) return;

            this.classList.remove('hidden');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                setTimeout(checkForMatch, 500);
            }
        }

        function checkForMatch() {
            const [firstCard, secondCard] = flippedCards;
            if (firstCard.textContent === secondCard.textContent) {
                firstCard.classList.add('matched');
                secondCard.classList.add('matched');
                matchedPairs.push(firstCard, secondCard);
            } else {
                firstCard.classList.add('hidden');
                secondCard.classList.add('hidden');
            }
            flippedCards = [];

            if (matchedPairs.length === boardSize) {
                alert('Congratulations! You won!');
                location.reload();
            }
        }

        createBoard();
    </script>
</body>
</html>
