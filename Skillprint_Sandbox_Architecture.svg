<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" height="100%" style="background:#070A13; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Header Accent Gradient -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background Grid Pattern -->
  <rect width="1600" height="960" fill="#070A13"/>
  <g stroke="#1F2937" stroke-width="0.5" opacity="0.2">
    <path d="M 0,100 L 1600,100 M 0,200 L 1600,200 M 0,300 L 1600,300 M 0,400 L 1600,400 M 0,500 L 1600,500 M 0,600 L 1600,600 M 0,700 L 1600,700 M 0,800 L 1600,800 M 0,900 L 1600,900" />
    <path d="M 120,0 L 120,960 M 420,0 L 420,960 M 750,0 L 750,960 M 1080,0 L 1080,960 M 1380,0 L 1380,960" />
  </g>

  <!-- Title & Branding -->
  <g transform="translate(80, 50)">
    <rect x="-4" y="-12" width="1440" height="4" fill="url(#headerGrad)"/>
    <text x="0" y="24" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">SKILLPRINT SANDBOX UML SEQUENCE FLOW</text>
  </g>

  <!-- ==================== HORIZONTAL GROUPS (PHASES) ==================== -->
  
  <!-- Phase 1: Game Creation -->
  <g id="phase1">
    <rect x="60" y="210" width="1480" height="170" rx="12" fill="#3B82F6" fill-opacity="0.02" stroke="#3B82F6" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="75" y="232" font-size="11" font-weight="bold" fill="#3B82F6" opacity="0.8" letter-spacing="1.5">PHASE 1: INTERACTIVE GAME CREATION</text>
  </g>

  <!-- Phase 2: Code Analysis & Registry -->
  <g id="phase2">
    <rect x="60" y="390" width="1480" height="200" rx="12" fill="#10B981" fill-opacity="0.02" stroke="#10B981" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="75" y="412" font-size="11" font-weight="bold" fill="#10B981" opacity="0.8" letter-spacing="1.5">PHASE 2: CODE ANALYSIS &amp; REGISTRY</text>
  </g>

  <!-- Phase 3: Live Adjustment Loop -->
  <g id="phase3">
    <rect x="60" y="600" width="1480" height="290" rx="12" fill="#8B5CF6" fill-opacity="0.02" stroke="#8B5CF6" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="75" y="622" font-size="11" font-weight="bold" fill="#8B5CF6" opacity="0.8" letter-spacing="1.5">PHASE 3: LIVE PARAMETER ADJUSTMENT LOOP</text>
  </g>

  <!-- ==================== LIFELINES (Dashed Lines) ==================== -->
  <g stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6">
    <line x1="120" y1="180" x2="120" y2="900" />
    <line x1="420" y1="180" x2="420" y2="900" />
    <line x1="750" y1="180" x2="750" y2="900" />
    <line x1="1080" y1="180" x2="1080" y2="900" />
    <line x1="1380" y1="180" x2="1380" y2="900" />
  </g>

  <!-- ==================== ACTIVATION BARS ==================== -->
  <!-- Developer active throughout -->
  <rect x="116" y="235" width="8" height="635" rx="4" fill="#3B82F6" fill-opacity="0.3"/>
  <!-- Sandbox FE active blocks -->
  <rect x="416" y="235" width="8" height="65" rx="4" fill="#3B82F6" fill-opacity="0.4"/>
  <rect x="416" y="545" width="8" height="60" rx="4" fill="#3B82F6" fill-opacity="0.4"/>
  <rect x="416" y="675" width="8" height="60" rx="4" fill="#3B82F6" fill-opacity="0.4"/>
  <!-- Chatbot BE active block -->
  <rect x="746" y="275" width="8" height="295" rx="4" fill="#10B981" fill-opacity="0.4"/>
  <!-- Backend active blocks -->
  <rect x="1076" y="425" width="8" height="110" rx="4" fill="#8B5CF6" fill-opacity="0.4"/>
  <rect x="1076" y="805" width="8" height="65" rx="4" fill="#8B5CF6" fill-opacity="0.4"/>
  <!-- Game Client active block -->
  <rect x="1376" y="635" width="8" height="235" rx="4" fill="#F59E0B" fill-opacity="0.4"/>

  <!-- ==================== SEQUENCE MESSAGES ==================== -->

  <!-- Phase 1 Messages -->
  <!-- Msg 1: Developer to FE -->
  <path d="M 124,250 L 416,250" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(270, 250)">
    <rect x="-120" y="-10" width="240" height="20" rx="6" fill="#070A13" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Enter Game Design Prompt</text>
  </g>
  
  <!-- Msg 2: FE to Chatbot BE -->
  <path d="M 424,290 L 746,290" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(585, 290)">
    <rect x="-140" y="-10" width="280" height="20" rx="6" fill="#070A13" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Request Gen (POST /api/generate-game)</text>
  </g>

  <!-- Msg 3: Chatbot BE self-loop -->
  <path d="M 754,320 C 798,320 798,350 754,350" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <g transform="translate(810, 335)">
    <rect x="-5" y="-10" width="250" height="20" rx="6" fill="#070A13" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <text x="5" y="4" font-size="11" font-weight="bold" fill="#A7F3D0" text-anchor="start">Compile Context &amp; Inject SDK scripts</text>
  </g>


  <!-- Phase 2 Messages -->
  <!-- Msg 4: Chatbot BE to Backend -->
  <path d="M 754,435 L 1076,435" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <g transform="translate(915, 435)">
    <rect x="-120" y="-10" width="240" height="20" rx="6" fill="#070A13" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Save Compiled Game Code &amp; Config</text>
  </g>

  <!-- Msg 5: Backend self-loop -->
  <path d="M 1084,465 C 1128,465 1128,495 1084,495" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <g transform="translate(1140, 480)">
    <rect x="-5" y="-10" width="255" height="20" rx="6" fill="#070A13" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="5" y="4" font-size="11" font-weight="bold" fill="#C084FC" text-anchor="start">Analyze Code &amp; Extract Parameters</text>
  </g>

  <!-- Msg 6: Backend to Chatbot BE (return) -->
  <path d="M 1076,525 L 754,525" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-slate)"/>
  <g transform="translate(915, 525)">
    <rect x="-115" y="-10" width="230" height="20" rx="6" fill="#070A13" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">Return Parameter Schema</text>
  </g>

  <!-- Msg 7: Chatbot BE to FE (return) -->
  <path d="M 746,555 L 424,555" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-slate)"/>
  <g transform="translate(585, 555)">
    <rect x="-135" y="-10" width="270" height="20" rx="6" fill="#070A13" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">Stream Logs &amp; Return Game URL</text>
  </g>


  <!-- Phase 3 Messages -->
  <!-- Msg 8: FE to Game Client (render iframe) -->
  <path d="M 424,645 L 1376,645" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(900, 645)">
    <rect x="-140" y="-10" width="280" height="20" rx="6" fill="#070A13" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Render Game in Sandbox Iframe</text>
  </g>

  <!-- Msg 9: Developer to FE (Hotkey/Adjust) -->
  <path d="M 124,690 L 416,690" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(270, 690)">
    <rect x="-135" y="-10" width="270" height="20" rx="6" fill="#070A13" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#E2E8F0" text-anchor="middle">Adjust Settings (Keys 1-9 / Sliders)</text>
  </g>

  <!-- Msg 10: FE to Game Client (postMessage) -->
  <path d="M 424,725 L 1376,725" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <g transform="translate(900, 725)">
    <rect x="-160" y="-10" width="320" height="20" rx="6" fill="#070A13" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#E2E8F0" text-anchor="middle">postMessage({ type: 'adjust', params })</text>
  </g>

  <!-- Msg 11: Game Client self-loop -->
  <path d="M 1384,750 C 1428,750 1428,780 1384,780" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <g transform="translate(1440, 765)">
    <rect x="-5" y="-10" width="220" height="20" rx="6" fill="#070A13" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
    <text x="5" y="4" font-size="11" font-weight="bold" fill="#FBBF24" text-anchor="start">Apply Real-Time Parameter Updates</text>
  </g>

  <!-- Msg 12: Game Client to Backend (SDK metrics) -->
  <path d="M 1376,820 L 1084,820" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <g transform="translate(1230, 820)">
    <rect x="-140" y="-10" width="280" height="20" rx="6" fill="#070A13" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#E2E8F0" text-anchor="middle">SDK: Transmit Screenshots &amp; Metrics</text>
  </g>

  <!-- Msg 13: Backend to Game Client (adjustment poll) -->
  <path d="M 1084,855 L 1376,855" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-slate)"/>
  <g transform="translate(1230, 855)">
    <rect x="-130" y="-10" width="260" height="20" rx="6" fill="#070A13" stroke="#94A3B8" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="4" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="middle">SDK: Poll Adjusted Game Parameters</text>
  </g>


  <!-- ==================== HEADER BOXES ==================== -->
  
  <!-- Lifeline 1: Developer -->
  <g transform="translate(30, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="65" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="65" rx="2" fill="#3B82F6"/>
    <text x="90" y="28" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Developer (User)</text>
    <!-- Icon: Silhouette -->
    <circle cx="90" cy="48" r="10" fill="#3B82F6" fill-opacity="0.15"/>
    <circle cx="90" cy="44" r="3.5" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
    <path d="M 83,53 C 83,49.5 86,49.5 90,49.5 C 94,49.5 97,49.5 97,53" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Lifeline 2: Sandbox FE -->
  <g transform="translate(330, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="65" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="65" rx="2" fill="#3B82F6"/>
    <text x="90" y="28" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Sandbox FE</text>
    <!-- Icon: Browser Window -->
    <circle cx="90" cy="48" r="10" fill="#3B82F6" fill-opacity="0.15"/>
    <rect x="83" y="42" width="14" height="11" rx="1.5" stroke="#3B82F6" stroke-width="1.5" fill="none"/>
    <path d="M 83,46 H 97" stroke="#3B82F6" stroke-width="1"/>
  </g>

  <!-- Lifeline 3: Chatbot BE -->
  <g transform="translate(660, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="65" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="65" rx="2" fill="#10B981"/>
    <text x="90" y="28" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Chatbot BE / AI</text>
    <!-- Icon: Chat bubble & Sparkle -->
    <circle cx="90" cy="48" r="10" fill="#10B981" fill-opacity="0.15"/>
    <path d="M 85,43 C 83.5,43 82.5,44 82.5,45.5 V 50.5 C 82.5,52 83.5,53 85,53 H 87 L 89,55 L 91,53 H 95 C 96.5,53 97.5,52 97.5,50.5 V 45.5 C 97.5,44 96.5,43 95,43 Z" stroke="#10B981" stroke-width="1" fill="none" stroke-linejoin="round"/>
    <path d="M 90,46 L 90.5,47.5 L 92,48 L 90.5,48.5 L 90,50 L 89.5,48.5 L 88,48 L 89.5,47.5 Z" fill="#10B981"/>
  </g>

  <!-- Lifeline 4: Backend -->
  <g transform="translate(990, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="65" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="65" rx="2" fill="#8B5CF6"/>
    <text x="90" y="28" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Backend / DB</text>
    <!-- Icon: Database Stack -->
    <circle cx="90" cy="48" r="10" fill="#8B5CF6" fill-opacity="0.15"/>
    <ellipse cx="90" cy="43.5" rx="5" ry="1.8" stroke="#8B5CF6" stroke-width="1.2" fill="none"/>
    <path d="M 85,43.5 V 47 C 85,48.5 95,48.5 95,47 V 43.5" stroke="#8B5CF6" stroke-width="1.2" fill="none"/>
    <path d="M 85,47 V 51.5 C 85,53 95,53 95,51.5 V 47" stroke="#8B5CF6" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Lifeline 5: Game Client -->
  <g transform="translate(1290, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="65" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="65" rx="2" fill="#F59E0B"/>
    <text x="90" y="28" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Game Client / SDK</text>
    <!-- Icon: Controller -->
    <circle cx="90" cy="48" r="10" fill="#F59E0B" fill-opacity="0.15"/>
    <rect x="83" y="43" width="14" height="9" rx="2.5" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
    <path d="M 85.5,47.5 H 88 M 86.8,46 V 49" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="92.5" cy="46.5" r="0.6" fill="#F59E0B"/>
    <circle cx="94" cy="48.5" r="0.6" fill="#F59E0B"/>
  </g>

</svg>
