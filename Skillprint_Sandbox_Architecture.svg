<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 740" width="100%" height="100%" style="background:#090D16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Column Backdrop Glowing Gradients -->
    <linearGradient id="portalGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sdkGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="loopGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Header Accent Gradient -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    
    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Background Grid Pattern -->
  <rect width="1680" height="740" fill="#070A13"/>
  <g stroke="#1F2937" stroke-width="0.5" opacity="0.2">
    <path d="M 0,100 L 1680,100 M 0,200 L 1680,200 M 0,300 L 1680,300 M 0,400 L 1680,400 M 0,500 L 1680,500 M 0,600 L 1680,600 M 0,700 L 1680,700" />
    <path d="M 200,0 L 200,740 M 400,0 L 400,740 M 600,0 L 600,740 M 800,0 L 800,740 M 1000,0 L 1000,740 M 1200,0 L 1200,740 M 1400,0 L 1400,740 M 1600,0 L 1600,740 M 1680,0 L 1680,740" />
  </g>

  <!-- Title & Branding -->
  <g transform="translate(80, 50)">
    <rect x="-4" y="-12" width="1520" height="4" fill="url(#headerGrad)"/>
    <text x="0" y="24" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">SKILLPRINT GAME GENERATOR</text>
  </g>

  <!-- Swimlanes / Columns Backdrops -->
  <!-- Column 1: Sandbox Frontend -->
  <g id="col-frontend">
    <rect x="80" y="140" width="460" height="520" rx="16" fill="url(#portalGlow)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.2"/>
    <rect x="80" y="140" width="460" height="40" rx="16" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="310" y="166" font-size="13" font-weight="bold" fill="#3B82F6" letter-spacing="2" text-anchor="middle">SANDBOX FRONTEND</text>
  </g>

  <!-- Column 2: AI Compiler Engine -->
  <g id="col-compiler">
    <rect x="580" y="140" width="460" height="520" rx="16" fill="url(#sdkGlow)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>
    <rect x="580" y="140" width="460" height="40" rx="16" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="810" y="166" font-size="13" font-weight="bold" fill="#10B981" letter-spacing="2" text-anchor="middle">AI COMPILER ENGINE</text>
  </g>

  <!-- Column 3: Database & Portal -->
  <g id="col-registry-portal">
    <rect x="1080" y="140" width="520" height="520" rx="16" fill="url(#loopGlow)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.2"/>
    <rect x="1080" y="140" width="520" height="40" rx="16" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="1340" y="166" font-size="13" font-weight="bold" fill="#8B5CF6" letter-spacing="2" text-anchor="middle">DATABASE &amp; PORTAL</text>
  </g>

  <!-- ==================== swimlane 1: SANDBOX FRONTEND ==================== -->
  
  <!-- Step 1 Card: Configure Design -->
  <g id="step1" filter="url(#shadow)">
    <rect x="140" y="200" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="140" y="200" width="6" height="130" rx="2" fill="#3B82F6"/>
    <!-- Icon: Sliders -->
    <circle cx="180" cy="265" r="20" fill="#3B82F6" fill-opacity="0.15"/>
    <path d="M 168,260 L 192,260 M 168,270 L 192,270" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="174" cy="260" r="3" fill="#3B82F6"/>
    <circle cx="186" cy="270" r="3" fill="#3B82F6"/>
    <!-- Text -->
    <text x="220" y="235" font-size="14" font-weight="bold" fill="#FFFFFF">Configure Design Input</text>
    <text x="220" y="260" font-size="12" fill="#94A3B8">Choose the game's theme, art style,</text>
    <text x="220" y="278" font-size="12" fill="#94A3B8">and target mood or cognitive skill.</text>
    <text x="220" y="296" font-size="12" fill="#94A3B8">Customize game rules to your liking.</text>
  </g>

  <!-- Step 1 -> Step 2 Arrow -->
  <path d="M 310,330 L 310,342" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 Card: Trigger Request -->
  <g id="step2" filter="url(#shadow)">
    <rect x="140" y="350" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="140" y="350" width="6" height="130" rx="2" fill="#3B82F6"/>
    <!-- Icon: Request Trigger -->
    <circle cx="180" cy="415" r="20" fill="#3B82F6" fill-opacity="0.15"/>
    <path d="M 170,407 L 192,415 L 170,423 L 176,415 Z" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <!-- Text -->
    <text x="220" y="385" font-size="14" font-weight="bold" fill="#FFFFFF">Request Generation</text>
    <text x="220" y="410" font-size="12" fill="#94A3B8">Send your idea to the AI builder.</text>
    <text x="220" y="428" font-size="12" fill="#94A3B8">Watch live as it designs and builds</text>
    <text x="220" y="446" font-size="12" fill="#94A3B8">your customized game from scratch.</text>
  </g>

  <!-- Step 2 -> Step 3 Arrow -->
  <path d="M 310,480 L 310,492" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 3 Card: Play Preview -->
  <g id="step3" filter="url(#shadow)">
    <rect x="140" y="500" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="140" y="500" width="6" height="130" rx="2" fill="#3B82F6"/>
    <!-- Icon: Controller -->
    <circle cx="180" cy="565" r="20" fill="#3B82F6" fill-opacity="0.15"/>
    <path d="M 167,565 C 167,557 175,557 180,557 C 185,557 193,557 193,565 C 193,571 189,573 185,573 L 175,573 C 171,573 167,571 167,565 Z" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="173" cy="565" r="1" fill="#3B82F6"/>
    <circle cx="187" cy="565" r="1" fill="#3B82F6"/>
    <path d="M 178,569 L 182,569" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Text -->
    <text x="220" y="535" font-size="14" font-weight="bold" fill="#FFFFFF">Play &amp; Live Adjust</text>
    <text x="220" y="560" font-size="12" fill="#94A3B8">Test-play the game instantly.</text>
    <text x="220" y="578" font-size="12" fill="#94A3B8">Use simple hotkeys to tweak settings</text>
    <text x="220" y="596" font-size="12" fill="#94A3B8">on the fly and see the effects live.</text>
  </g>


  <!-- ==================== swimlane 2: AI COMPILER ENGINE ==================== -->

  <!-- Step 4 Card: Assemble Prompt -->
  <g id="step4" filter="url(#shadow)">
    <rect x="640" y="200" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="640" y="200" width="6" height="130" rx="2" fill="#10B981"/>
    <!-- Icon: Document Context -->
    <circle cx="680" cy="265" r="20" fill="#10B981" fill-opacity="0.15"/>
    <rect x="670" y="253" width="20" height="24" rx="2" stroke="#10B981" stroke-width="2" fill="none"/>
    <path d="M 674,261 H 686 M 674,267 H 686 M 674,272 H 680" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Text -->
    <text x="720" y="235" font-size="14" font-weight="bold" fill="#FFFFFF">Compile Prompt Context</text>
    <text x="720" y="260" font-size="12" fill="#94A3B8">AI gathers all design guidelines,</text>
    <text x="720" y="278" font-size="12" fill="#94A3B8">theme templates, and your custom</text>
    <text x="720" y="296" font-size="12" fill="#94A3B8">parameters to plan the game.</text>
  </g>

  <!-- Step 4 -> Step 5 Arrow -->
  <path d="M 810,330 L 810,342" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 5 Card: Code Generation -->
  <g id="step5" filter="url(#shadow)">
    <rect x="640" y="350" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="640" y="350" width="6" height="130" rx="2" fill="#10B981"/>
    <!-- Icon: Sparkles / Brain -->
    <circle cx="680" cy="415" r="20" fill="#10B981" fill-opacity="0.15"/>
    <path d="M 680,403 L 682,410 L 689,412 L 682,414 L 680,421 L 678,414 L 671,412 L 678,410 Z" fill="#10B981"/>
    <!-- Text -->
    <text x="720" y="385" font-size="14" font-weight="bold" fill="#FFFFFF">AI Code Generation</text>
    <text x="720" y="410" font-size="12" fill="#94A3B8">AI generates the complete gameplay,</text>
    <text x="720" y="428" font-size="12" fill="#94A3B8">creating original art, game controls,</text>
    <text x="720" y="446" font-size="12" fill="#94A3B8">rules, and win/lose logic.</text>
  </g>

  <!-- Step 5 -> Step 6 Arrow -->
  <path d="M 810,480 L 810,492" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 6 Card: SDK Injection -->
  <g id="step6" filter="url(#shadow)">
    <rect x="640" y="500" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="640" y="500" width="6" height="130" rx="2" fill="#10B981"/>
    <!-- Icon: Injections -->
    <circle cx="680" cy="565" r="20" fill="#10B981" fill-opacity="0.15"/>
    <path d="M 672,560 L 666,565 L 672,570 M 688,560 L 694,565 L 688,570 M 682,558 L 678,572" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Text -->
    <text x="720" y="535" font-size="14" font-weight="bold" fill="#FFFFFF">SDK Script Injection</text>
    <text x="720" y="560" font-size="12" fill="#94A3B8">AI embeds standardized tools and</text>
    <text x="720" y="578" font-size="12" fill="#94A3B8">the Skillprint smart adapter into the</text>
    <text x="720" y="596" font-size="12" fill="#94A3B8">game's code to prepare for saving.</text>
  </g>


  <!-- ==================== swimlane 3: DATABASE & PORTAL ==================== -->

  <!-- Step 7 Card: Save Game & Database Registry -->
  <g id="step7" filter="url(#shadow)">
    <rect x="1170" y="200" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="1170" y="200" width="6" height="130" rx="2" fill="#8B5CF6"/>
    <!-- Icon: Storage Disk / Stack -->
    <circle cx="1210" cy="265" r="20" fill="#8B5CF6" fill-opacity="0.15"/>
    <ellipse cx="1210" cy="257" rx="12" ry="4" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <path d="M 1198,257 V 267 C 1198,271 1210,271 1210,271 C 1210,271 1222,271 1222,267 V 257" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <path d="M 1198,267 V 277 C 1198,281 1210,281 1210,281 C 1210,281 1222,281 1222,277 V 267" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <!-- Text -->
    <text x="1250" y="235" font-size="14" font-weight="bold" fill="#FFFFFF">Save Game &amp; Registry</text>
    <text x="1250" y="260" font-size="12" fill="#94A3B8">Saves the game bundle on server, names</text>
    <text x="1250" y="278" font-size="12" fill="#94A3B8">it with an icon emoji, and registers all</text>
    <text x="1250" y="296" font-size="12" fill="#94A3B8">adjustable parameters in the database.</text>
  </g>

  <!-- Step 7 -> Step 8 Arrow -->
  <path d="M 1340,330 L 1340,342" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Step 8 Card: Catalog & Activate -->
  <g id="step8" filter="url(#shadow)">
    <rect x="1170" y="350" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="1170" y="350" width="6" height="130" rx="2" fill="#8B5CF6"/>
    <!-- Icon: Catalog Folder & Checkmark -->
    <circle cx="1210" cy="415" r="20" fill="#8B5CF6" fill-opacity="0.15"/>
    <path d="M 1198,405 H 1206 L 1210,410 H 1222 C 1224,410 1226,412 1226,414 V 425 C 1226,427 1224,429 1222,429 H 1198 C 1196,429 1194,427 1194,425 V 409 C 1194,407 1196,405 1198,405 Z" stroke="#8B5CF6" stroke-width="2" fill="none"/>
    <path d="M 1205,420 L 1208,423 L 1216,415" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Text -->
    <text x="1250" y="385" font-size="14" font-weight="bold" fill="#FFFFFF">Catalog &amp; Activate</text>
    <text x="1250" y="410" font-size="12" fill="#94A3B8">Adds game to private catalog. Admins</text>
    <text x="1250" y="428" font-size="12" fill="#94A3B8">turn it on with one click and link it</text>
    <text x="1250" y="446" font-size="12" fill="#94A3B8">to targeted user cognitive training goals.</text>
  </g>

  <!-- Step 8 -> Step 9 Arrow -->
  <path d="M 1340,480 L 1340,492" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Step 9 Card: User Playback & SDK -->
  <g id="step9" filter="url(#shadow)">
    <rect x="1170" y="500" width="340" height="130" rx="12" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="1170" y="500" width="6" height="130" rx="2" fill="#8B5CF6"/>
    <!-- Icon: Trophy -->
    <circle cx="1210" cy="565" r="20" fill="#8B5CF6" fill-opacity="0.15"/>
    <path d="M 1202,555 H 1218 V 565 C 1218,570 1215,573 1210,573 C 1205,573 1202,570 1202,565 Z M 1210,573 V 577 M 1205,577 H 1215" stroke="#8B5CF6" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <!-- Text -->
    <text x="1250" y="535" font-size="14" font-weight="bold" fill="#FFFFFF">User Playback &amp; SDK</text>
    <text x="1250" y="560" font-size="12" fill="#94A3B8">Players play the game inside the app.</text>
    <text x="1250" y="578" font-size="12" fill="#94A3B8">The game adjusts rules in real-time,</text>
    <text x="1250" y="596" font-size="12" fill="#94A3B8">adapting to keep players in flow.</text>
  </g>


  <!-- ==================== CONNECTIONS / FLOW ARROWS ==================== -->

  <!-- Card 2 -> Card 4 (API Request Trigger) -->
  <path d="M 480,415 C 560,415 560,265 630,265" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="560" y="325" font-size="10" font-weight="bold" fill="#10B981" text-anchor="middle" transform="rotate(-30 560 325)">BUILD REQUEST</text>

  <!-- Card 6 -> Card 7 (Write Bundle Output) -->
  <path d="M 980,565 C 1060,565 1060,265 1162,265" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="1075" y="380" font-size="10" font-weight="bold" fill="#8B5CF6" text-anchor="middle" transform="rotate(-30 1075 380)">SAVE GAME</text>

  <!-- Card 6 -> Card 3 (Compile Done callback) -->
  <path d="M 640,565 L 492,565" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <text x="560" y="555" font-size="10" font-weight="bold" fill="#3B82F6" text-anchor="middle">LOAD PREVIEW</text>

  <!-- Card 7 -> Card 9 (Direct Parameter Fetch) -->
  <path d="M 1510,265 C 1580,265 1580,565 1520,565" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arrow-purple)"/>
  <text x="1560" y="415" font-size="10" font-weight="bold" fill="#8B5CF6" text-anchor="middle" transform="rotate(90 1560 415)">LOAD SETTINGS</text>
</svg>
