<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 740" width="100%" height="100%" style="background:#090D16; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Column Backdrop Glowing Gradients -->
    <linearGradient id="portalGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="sdkGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Header Accent Gradient -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    
    <!-- Progress Bar Gradients -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background Grid Pattern -->
  <rect width="1680" height="740" fill="#070A13"/>
  <g stroke="#1F2937" stroke-width="0.5" opacity="0.2">
    <path d="M 0,100 L 1680,100 M 0,200 L 1680,200 M 0,300 L 1680,300 M 0,400 L 1680,400 M 0,500 L 1680,500 M 0,600 L 1680,600 M 0,700 L 1680,700" />
    <path d="M 200,0 L 200,740 M 400,0 L 400,740 M 600,0 L 600,740 M 800,0 L 800,740 M 1000,0 L 1000,740 M 1200,0 L 1200,740 M 1400,0 L 1400,740 M 1600,0 L 1600,740" />
  </g>

  <!-- Title & Branding -->
  <g transform="translate(80, 50)">
    <rect x="-4" y="-12" width="1520" height="4" fill="url(#headerGrad)"/>
    <text x="0" y="24" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">PERFORMANCE REPORT: LIGHTHOUSE &amp; CORE WEB VITALS</text>
  </g>

  <!-- Swimlanes / Columns Backdrops -->
  <!-- Column 1: Lighthouse Category Scores -->
  <g id="col-scores">
    <rect x="80" y="140" width="720" height="520" rx="16" fill="url(#portalGlow)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.2"/>
    <rect x="80" y="140" width="720" height="45" rx="16" fill="#3B82F6" fill-opacity="0.08" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="440" y="168" font-size="14" font-weight="bold" fill="#3B82F6" letter-spacing="2" text-anchor="middle">LIGHTHOUSE CATEGORY SCORES</text>
  </g>

  <!-- Column 2: Performance Metrics (Core Web Vitals) -->
  <g id="col-metrics">
    <rect x="880" y="140" width="720" height="520" rx="16" fill="url(#sdkGlow)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>
    <rect x="880" y="140" width="720" height="45" rx="16" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.2"/>
    <text x="1240" y="168" font-size="14" font-weight="bold" fill="#10B981" letter-spacing="2" text-anchor="middle">KEY CORE WEB VITALS &amp; METRICS</text>
  </g>

  <!-- ==================== swimlane 1: LIGHTHOUSE SCORES ==================== -->
  
  <!-- Score Row Headers -->
  <g transform="translate(120, 215)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#64748B" letter-spacing="1">AUDITED CATEGORY</text>
    <text x="280" y="0" font-size="12" font-weight="bold" fill="#64748B" letter-spacing="1" text-anchor="middle">ORIGINAL</text>
    <text x="460" y="0" font-size="12" font-weight="bold" fill="#64748B" letter-spacing="1" text-anchor="middle">REFACTORED</text>
    <text x="600" y="0" font-size="12" font-weight="bold" fill="#64748B" letter-spacing="1" text-anchor="middle">CHANGE</text>
  </g>

  <g stroke="#1F2937" stroke-width="1" opacity="0.3">
    <line x1="120" y1="230" x2="760" y2="230"/>
  </g>

  <!-- Row 1: Performance -->
  <g transform="translate(120, 270)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#FFFFFF">Performance</text>
    
    <!-- Original Score Gauge (37) -->
    <rect x="200" y="-14" width="160" height="18" rx="9" fill="#1E293B"/>
    <rect x="200" y="-14" width="59.2" height="18" rx="9" fill="url(#redGrad)"/>
    <text x="280" y="-1" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">37%</text>

    <!-- Refactored Score Gauge (70) -->
    <rect x="380" y="-14" width="160" height="18" rx="9" fill="#1E293B"/>
    <rect x="380" y="-14" width="112" height="18" rx="9" fill="url(#orangeGrad)"/>
    <text x="460" y="-1" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">70%</text>

    <!-- Change Badge -->
    <rect x="560" y="-16" width="80" height="22" rx="11" fill="#10B981" fill-opacity="0.15"/>
    <text x="600" y="-1" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">+33%</text>
  </g>

  <!-- Row 2: Accessibility -->
  <g transform="translate(120, 345)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#FFFFFF">Accessibility</text>
    
    <!-- Original Score Gauge (71) -->
    <rect x="200" y="-14" width="160" height="18" rx="9" fill="#1E293B"/>
    <rect x="200" y="-14" width="113.6" height="18" rx="9" fill="url(#orangeGrad)"/>
    <text x="280" y="-1" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">71%</text>

    <!-- Refactored Score Gauge (91) -->
    <rect x="380" y="-14" width="160" height="18" rx="9" fill="#1E293B"/>
    <rect x="380" y="-14" width="145.6" height="18" rx="9" fill="url(#greenGrad)"/>
    <text x="460" y="-1" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">91%</text>

    <!-- Change Badge -->
    <rect x="560" y="-16" width="80" height="22" rx="11" fill="#10B981" fill-opacity="0.15"/>
    <text x="600" y="-1" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">+20%</text>
  </g>

  <!-- Row 3: Best Practices -->
  <g transform="translate(120, 420)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#FFFFFF">Best Practices</text>
    
    <!-- Original Score Gauge (73) -->
    <rect x="200" y="-14" width="160" height="18" rx="9" fill="#1E293B"/>
    <rect x="200" y="-14" width="116.8" height="18" rx="9" fill="url(#orangeGrad)"/>
    <text x="280" y="-1" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">73%</text>

    <!-- Refactored Score Gauge (96) -->
    <rect x="380" y="-14" width="160" height="18" rx="9" fill="#1E293B"/>
    <rect x="380" y="-14" width="153.6" height="18" rx="9" fill="url(#greenGrad)"/>
    <text x="460" y="-1" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">96%</text>

    <!-- Change Badge -->
    <rect x="560" y="-16" width="80" height="22" rx="11" fill="#10B981" fill-opacity="0.15"/>
    <text x="600" y="-1" font-size="12" font-weight="bold" fill="#10B981" text-anchor="middle">+23%</text>
  </g>

  <!-- Row 4: SEO -->
  <g transform="translate(120, 495)">
    <text x="0" y="0" font-size="15" font-weight="bold" fill="#FFFFFF">SEO</text>
    
    <!-- Original Score Gauge (100) -->
    <rect x="200" y="-14" width="160" height="18" rx="9" fill="#1E293B"/>
    <rect x="200" y="-14" width="160" height="18" rx="9" fill="url(#greenGrad)"/>
    <text x="280" y="-1" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">100%</text>

    <!-- Refactored Score Gauge (100) -->
    <rect x="380" y="-14" width="160" height="18" rx="9" fill="#1E293B"/>
    <rect x="380" y="-14" width="160" height="18" rx="9" fill="url(#greenGrad)"/>
    <text x="460" y="-1" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">100%</text>

    <!-- Change Badge -->
    <rect x="560" y="-16" width="80" height="22" rx="11" fill="#64748B" fill-opacity="0.15"/>
    <text x="600" y="-1" font-size="12" font-weight="bold" fill="#94A3B8" text-anchor="middle">0%</text>
  </g>


  <!-- ==================== swimlane 2: KEY WEB VITALS ==================== -->
  
  <!-- Metric Card 1: Largest Contentful Paint (LCP) -->
  <g id="card-lcp" filter="url(#shadow)" transform="translate(920, 210)">
    <rect x="0" y="0" width="640" height="110" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="110" rx="2" fill="#10B981"/>
    
    <!-- Metric Label & Details -->
    <text x="24" y="30" font-size="15" font-weight="bold" fill="#FFFFFF">Largest Contentful Paint (LCP)</text>
    <text x="24" y="52" font-size="11" fill="#64748B">Main content loading speed</text>
    
    <!-- Original vs Refactored Values -->
    <text x="24" y="88" font-size="12" fill="#94A3B8">Original: <tspan fill="#EF4444" font-weight="bold">5.8 s</tspan></text>
    <text x="180" y="88" font-size="12" fill="#94A3B8">Refactored: <tspan fill="#10B981" font-weight="bold">2.3 s</tspan></text>

    <!-- Highlight Indicator -->
    <rect x="440" y="35" width="176" height="40" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="528" y="60" font-size="14" font-weight="900" fill="#10B981" text-anchor="middle">2.5x FASTER</text>
  </g>

  <!-- Metric Card 2: Total Blocking Time (TBT) -->
  <g id="card-tbt" filter="url(#shadow)" transform="translate(920, 350)">
    <rect x="0" y="0" width="640" height="110" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="110" rx="2" fill="#10B981"/>
    
    <!-- Metric Label & Details -->
    <text x="24" y="30" font-size="15" font-weight="bold" fill="#FFFFFF">Total Blocking Time (TBT)</text>
    <text x="24" y="52" font-size="11" fill="#64748B">Main-thread execution blocking (input delay and freeze duration)</text>
    
    <!-- Original vs Refactored Values -->
    <text x="24" y="88" font-size="12" fill="#94A3B8">Original: <tspan fill="#EF4444" font-weight="bold">2,270 ms</tspan></text>
    <text x="180" y="88" font-size="12" fill="#94A3B8">Refactored: <tspan fill="#10B981" font-weight="bold">80 ms</tspan></text>

    <!-- Highlight Indicator -->
    <rect x="440" y="35" width="176" height="40" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="528" y="60" font-size="14" font-weight="900" fill="#10B981" text-anchor="middle">28.4x REDUCTION</text>
  </g>

  <!-- Metric Card 3: Speed Index (SI) & Time to Interactive (TTI) -->
  <g id="card-si-tti" filter="url(#shadow)" transform="translate(920, 490)">
    <rect x="0" y="0" width="640" height="130" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="130" rx="2" fill="#10B981"/>
    
    <!-- Metric Label & Details -->
    <text x="24" y="30" font-size="15" font-weight="bold" fill="#FFFFFF">Page Speed Index &amp; Interaction Readiness</text>
    <text x="24" y="52" font-size="11" fill="#64748B">Speed Index (SI) and Time to Interactive (TTI) comparison</text>
    
    <!-- Original vs Refactored Values -->
    <text x="24" y="85" font-size="12" fill="#94A3B8">SI Original: <tspan fill="#EF4444" font-weight="bold">6.4 s</tspan> → Refactored: <tspan fill="#10B981" font-weight="bold">4.5 s</tspan></text>
    <text x="24" y="108" font-size="12" fill="#94A3B8">TTI Original: <tspan fill="#EF4444" font-weight="bold">4.5 s</tspan> → Refactored: <tspan fill="#10B981" font-weight="bold">1.7 s</tspan></text>

    <!-- Highlight Indicator -->
    <rect x="440" y="45" width="176" height="40" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="528" y="70" font-size="14" font-weight="900" fill="#10B981" text-anchor="middle">~3x FASTER</text>
  </g>

</svg>
